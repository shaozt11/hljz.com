        // ============================================================
        //  音效管理器
        // ============================================================
        const SoundManager = {
            sounds: {},
            ctx: null,
            initialized: false,
            globalVolume: 1.0,
            init() {
                try {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                    this.loadSound('click', 'assets/sounds/click.wav');
                    this.loadSound('clickAlt', 'assets/sounds/click-alt.wav');
                    this.loadSound('showToast', 'assets/sounds/message.wav');
                    this.initialized = true;
                } catch (e) {
                    console.warn('⚠️ 音效初始化失败:', e);
                    showToast('err on load sounds: ' + e)
                }
            },
            loadSound(name, url) {
                if (!this.ctx) return;
                fetch(url).then(res => res.arrayBuffer()).then(buffer => this.ctx.decodeAudioData(buffer)).then(decoded => {
                    this.sounds[name] = decoded;
                }).catch(err => console.warn(`加载音效 ${name} 失败:`, err));
            },
            setGlobalVolume(vol) {
                this.globalVolume = Math.max(0, Math.min(1, vol));
                try {
                    const val = Math.round(vol * 100);
                    localStorage.setItem(VOLUME_STORAGE_KEY, String(val));
                } catch (_) { }
            },
            play(name, volume = 0.6) {
                if (!this.initialized || !this.ctx || this.ctx.state === 'suspended') {
                    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume().catch(() => { });
                    return;
                }
                const buffer = this.sounds[name];
                if (!buffer) return;
                try {
                    const source = this.ctx.createBufferSource();
                    const gain = this.ctx.createGain();
                    source.buffer = buffer;
                    const finalVol = volume * this.globalVolume;
                    gain.gain.value = finalVol;
                    source.connect(gain);
                    gain.connect(this.ctx.destination);
                    source.start(0);
                } catch (e) { }
            }
        };

        // ============================================================
        //  音量恢复与绑定
        // ============================================================
        function restoreVolume() {
            try {
                const saved = localStorage.getItem(VOLUME_STORAGE_KEY);
                if (saved !== null) {
                    const val = parseInt(saved, 10);
                    if (!isNaN(val) && val >= 0 && val <= 100) {
                        if (volumeSlider) volumeSlider.value = val; if (volumeInput)
                            volumeInput.value = val;
                        SoundManager.setGlobalVolume(val / 100); return;
                    }
                }
            } catch (_) { }
            if (volumeSlider) volumeSlider.value = 60;
            if (volumeInput) volumeInput.value = 60;
            SoundManager.setGlobalVolume(0.6);
        }

        function bindVolumeControls() {
            if (volumeSlider) volumeSlider.addEventListener('input', function () {
                const val = parseInt(this.value, 10); if (
                    volumeInput) volumeInput.value = val;
                SoundManager.setGlobalVolume(val / 100);
            });
            if (volumeInput) {
                volumeInput.addEventListener('input', function () {
                    let val = parseInt(this.value, 10); if (isNaN(val)) val =
                        0;
                    val = Math.max(0, Math.min(100, val));
                    this.value = val; if (volumeSlider) volumeSlider.value = val;
                    SoundManager.setGlobalVolume(val / 100);
                });
                volumeInput.addEventListener('blur', function () {
                    let val = parseInt(this.value, 10); if (isNaN(val)) val =
                        0;
                    val = Math.max(0, Math.min(100, val));
                    this.value = val; if (volumeSlider) volumeSlider.value = val;
                    SoundManager.setGlobalVolume(val / 100);
                });
            }
        }

        // ============================================================
        //  🖐️ 触摸屏支持 (核心新增)
        // ============================================================
        let touchDragState = { active: false, type: null, preview: null, startX: 0, startY: 0, currentX: 0, currentY: 0 };

        function startToolTouchDrag(e, type) {
            e.preventDefault();
            if (gameState !== STATE.LAYOUT) {
                showToast(`<i class="fas fa-ban"></i> 只能在布局阶段创建`, 1200);
                return;
            }
            if (touchDragState.active) return;

            const touch = e.touches[0];
            if (!touch) return;

            touchDragState.active = true;
            touchDragState.type = type;
            touchDragState.startX = touch.clientX;
            touchDragState.startY = touch.clientY;
            touchDragState.currentX = touch.clientX;
            touchDragState.currentY = touch.clientY;

            // ===== 创建预览元素（样式完全由 CSS 控制） =====
            const el = createDragImage(type);   // 现在只返回带有类名的元素
            el.classList.add('active');         // 触发缩放动画
            el.style.left = touch.clientX + 'px';
            el.style.top = touch.clientY + 'px';
            document.body.appendChild(el);
            touchDragState.preview = el;

            document.addEventListener('touchmove', onToolTouchMove, { passive: false });
            document.addEventListener('touchend', onToolTouchEnd, { passive: false });
            document.addEventListener('touchcancel', onToolTouchEnd, { passive: false });
        }

        function onToolTouchMove(e) {
            e.preventDefault();
            if (!touchDragState.active || !touchDragState.preview) return;
            const touch = e.touches[0];
            if (!touch) return;
            touchDragState.currentX = touch.clientX;
            touchDragState.currentY = touch.clientY;
            touchDragState.preview.style.left = touch.clientX + 'px';
            touchDragState.preview.style.top = touch.clientY + 'px';
        }

        function onToolTouchEnd(e) {
            document.removeEventListener('touchmove', onToolTouchMove);
            document.removeEventListener('touchend', onToolTouchEnd);
            document.removeEventListener('touchcancel', onToolTouchEnd);
            if (!touchDragState.active) { cleanupTouchDrag(); return; }
            const touch = e.changedTouches ? e.changedTouches[0] : null;
            if (!touch) { cleanupTouchDrag(); return; }
            const rect = canvas.getBoundingClientRect();
            const inCanvas = touch.clientX >= rect.left && touch.clientX <= rect.right &&
                touch.clientY >= rect.top && touch.clientY <= rect.bottom;
            if (inCanvas && gameState === STATE.LAYOUT) {
                const pos = getMousePos({ clientX: touch.clientX, clientY: touch.clientY });
                const mx = pos.x,
                    my = pos.y;
                if (mx >= 0 && mx <= W && my >= 0 && my <= H) {
                    const radius = Math.min(DEFAULT_RADIUS, MAX_RADIUS);
                    let obj;
                    if (touchDragState.type === 'field') {
                        obj = createField(mx, my, radius);
                        fields.push(obj);
                        showToast(`<i class="fas fa-check-circle"></i> 创建引力场 (r=${Math.round(radius)})`, 800);
                    } else if (
                        touchDragState.type === 'boost') {
                        obj = createBoostZone(mx, my, radius);
                        boostZones.push(obj);
                        showToast(`<i class="fas fa-check-circle"></i> 创建加速区域 (r=${Math.round(radius)})`, 800);
                    } else if (
                        touchDragState.type === 'brake') {
                        obj = createBrakeZone(mx, my, radius);
                        brakeZones.push(obj);
                        showToast(`<i class="fas fa-check-circle"></i> 创建刹车区域 (r=${Math.round(radius)})`, 800);
                    }
                    updateUI();
                } else showToast(`<i class="fas fa-exclamation-triangle"></i> 请拖拽到画布内部`, 1000);
            } else showToast(`<i class="fas fa-exclamation-triangle"></i> 请拖拽到画布内部`, 1000);
            cleanupTouchDrag();
        }

        function cleanupTouchDrag() {
            if (touchDragState.preview && touchDragState.preview.parentNode) touchDragState.preview.parentNode.removeChild(
                touchDragState.preview);
            touchDragState.active = false;
            touchDragState.type = null;
            touchDragState.preview = null;
        }

        let touchCanvasState = {
            active: false, touchId: null, target: null, mode: null, offsetX: 0, offsetY: 0,
            startRadius: 0, startDist: 0
        };

        function onCanvasTouchStart(e) {
            if (touchDragState.active) return;
            if (gameState !== STATE.LAYOUT) return;
            e.preventDefault();
            const touch = e.touches[0];
            if (!touch) return;
            const pos = getMousePos({ clientX: touch.clientX, clientY: touch.clientY });
            const mx = pos.x,
                my = pos.y;
            const field = getFieldAt(mx, my);
            if (field) {
                selectedField = field;
                selectedBoost = null;
                selectedBrake = null;
                const dist = distance(mx, my, field.cx, field.cy);
                const ratio = field.radius > 0 ? dist / field.radius : 0;
                if (ratio < MOVE_THRESHOLD) {
                    touchCanvasState.mode = 'move';
                    touchCanvasState.offsetX = mx - field.cx;
                    touchCanvasState.offsetY = my - field.cy;
                } else {
                    touchCanvasState.mode = 'resize';
                    touchCanvasState.startRadius = field.radius;
                    touchCanvasState.startDist = dist;
                }
                touchCanvasState.active = true;
                touchCanvasState.target = { type: 'field', ref: field };
                document.addEventListener('touchmove', onCanvasTouchMove, { passive: false });
                document.addEventListener('touchend', onCanvasTouchEnd, { passive: false });
                document.addEventListener('touchcancel', onCanvasTouchEnd, { passive: false });
                return;
            }
            const boost = getBoostAt(mx, my);
            if (boost) {
                selectedBoost = boost;
                selectedField = null;
                selectedBrake = null;
                const dist = distance(mx, my, boost.cx, boost.cy);
                const ratio = boost.radius > 0 ? dist / boost.radius : 0;
                if (ratio < MOVE_THRESHOLD) {
                    touchCanvasState.mode = 'move';
                    touchCanvasState.offsetX = mx - boost.cx;
                    touchCanvasState.offsetY = my - boost.cy;
                } else {
                    touchCanvasState.mode = 'resize';
                    touchCanvasState.startRadius = boost.radius;
                    touchCanvasState.startDist = dist;
                }
                touchCanvasState.active = true;
                touchCanvasState.target = { type: 'boost', ref: boost };
                document.addEventListener('touchmove', onCanvasTouchMove, { passive: false });
                document.addEventListener('touchend', onCanvasTouchEnd, { passive: false });
                document.addEventListener('touchcancel', onCanvasTouchEnd, { passive: false });
                return;
            }
            const brake = getBrakeAt(mx, my);
            if (brake) {
                selectedBrake = brake;
                selectedField = null;
                selectedBoost = null;
                const dist = distance(mx, my, brake.cx, brake.cy);
                const ratio = brake.radius > 0 ? dist / brake.radius : 0;
                if (ratio < MOVE_THRESHOLD) {
                    touchCanvasState.mode = 'move';
                    touchCanvasState.offsetX = mx - brake.cx;
                    touchCanvasState.offsetY = my - brake.cy;
                } else {
                    touchCanvasState.mode = 'resize';
                    touchCanvasState.startRadius = brake.radius;
                    touchCanvasState.startDist = dist;
                }
                touchCanvasState.active = true;
                touchCanvasState.target = { type: 'brake', ref: brake };
                document.addEventListener('touchmove', onCanvasTouchMove, { passive: false });
                document.addEventListener('touchend', onCanvasTouchEnd, { passive: false });
                document.addEventListener('touchcancel', onCanvasTouchEnd, { passive: false });
                return;
            }
            clearSelection();
        }

        function onCanvasTouchMove(e) {
            if (!touchCanvasState.active) return;
            e.preventDefault();
            const touch = e.touches[0];
            if (!touch) return;
            const pos = getMousePos({ clientX: touch.clientX, clientY: touch.clientY });
            const mx = pos.x,
                my = pos.y;
            const rect = trashZone.getBoundingClientRect();
            const inTrash = touch.clientX >= rect.left && touch.clientX <= rect.right &&
                touch.clientY >= rect.top && touch.clientY <= rect.bottom;
            trashZone.classList.toggle('drag-over', inTrash);
            if (!touchCanvasState.target) return;
            if (touchCanvasState.mode === 'move' && !inTrash) {
                const target = touchCanvasState.target;
                const newX = clamp(mx - touchCanvasState.offsetX, 0, W);
                const newY = clamp(my - touchCanvasState.offsetY, 0, H);
                if (target.type === 'field') {
                    target.ref.cx = newX;
                    target.ref.cy = newY;
                } else if (target.type === 'boost') {
                    target.ref.cx = newX;
                    target.ref.cy = newY;
                } else if (target.type === 'brake') {
                    target.ref.cx = newX;
                    target.ref.cy = newY;
                }
            } else if (touchCanvasState.mode === 'resize' && !inTrash) {
                const target = touchCanvasState.target;
                const dist = distance(mx, my, target.ref.cx, target.ref.cy);
                let newRadius = Math.max(dist, MIN_RADIUS);
                newRadius = Math.min(newRadius, MAX_RADIUS);
                target.ref.radius = newRadius;
                if (target.type === 'field') updateFieldStrength(target.ref);
                else if (target.type === 'boost') updateBoostStrength(target.ref);
                else if (target.type === 'brake') updateBrakeStrength(target.ref);
            }
        }

        function onCanvasTouchEnd(e) {
            document.removeEventListener('touchmove', onCanvasTouchMove);
            document.removeEventListener('touchend', onCanvasTouchEnd);
            document.removeEventListener('touchcancel', onCanvasTouchEnd);
            if (!touchCanvasState.active) { trashZone.classList.remove('drag-over'); return; }
            const touch = e.changedTouches ? e.changedTouches[0] : null;
            if (touch && touchCanvasState.target) {
                const rect = trashZone.getBoundingClientRect();
                const inTrash = touch.clientX >= rect.left && touch.clientX <= rect.right &&
                    touch.clientY >= rect.top && touch.clientY <= rect.bottom;
                if (inTrash) {
                    const target = touchCanvasState.target;
                    if (target.type === 'field') {
                        removeField(target.ref);
                        showToast(`<i class="fas fa-trash"></i> 已删除引力场`, 1000);
                    } else if (target.type === 'boost') {
                        removeBoostZone(target.ref);
                        showToast(`<i class="fas fa-trash"></i> 已删除加速区域`, 1000);
                    } else if (target.type === 'brake') {
                        removeBrakeZone(target.ref);
                        showToast(`<i class="fas fa-trash"></i> 已删除刹车区域`, 1000);
                    }
                    updateUI();
                }
            }
            touchCanvasState.active = false;
            touchCanvasState.target = null;
            touchCanvasState.mode = null;
            trashZone.classList.remove('drag-over');
        }

        function bindTouchEvents() {
            if (dragSource) dragSource.addEventListener('touchstart', (e) => startToolTouchDrag(e, 'field'), { passive: false });
            if (boostDragSource) boostDragSource.addEventListener('touchstart', (e) => startToolTouchDrag(e, 'boost'), {
                passive: false
            });
            if (brakeDragSource) brakeDragSource.addEventListener('touchstart', (e) => startToolTouchDrag(e, 'brake'), {
                passive: false
            });
            if (canvas) {
                canvas.addEventListener('touchstart', onCanvasTouchStart, { passive: false });
                canvas.addEventListener('touchmove', (e) => {
                    if (gameState === STATE.LAYOUT || gameState === STATE
                        .RUNNING) e.preventDefault();
                }, { passive: false });
            }
            document.addEventListener('touchmove', (e) => {
                const target = e.target;
                if (target && (target.closest('.canvas-wrapper') || target.closest('.toolbar-tools') ||
                    target.closest('.status-bar') || target.closest('.level-section'))) e.preventDefault();
            }, { passive: false });
            console.log('🖐️ 触摸支持已绑定');
        }

        // ============================================================
        //  启动
        // ============================================================
        function extractLevels(data) {
            if (!Array.isArray(data)) return [];
            return data.filter(item => item.name && item.start && item.end && item.path && Array.isArray(item.path));
        }

        function initGame(levels) {
            SoundManager.init();
            restoreVolume();
            bindVolumeControls();
            restoreUIScale();
            loadWorkshopData();
            LEVELS = levels;
            isWorkshopMode = false;
            mainLevelsBackup = null;
            const activeCollection = workshopCollections.find(c => c.isActive);
            if (activeCollection && activeCollection.levels && activeCollection.levels.length > 0) {
                isWorkshopMode = true;
                mainLevelsBackup = LEVELS;
                LEVELS = activeCollection.levels;
                unlockedLevelIndex = LEVELS.length - 1;
                currentLevelIndex = 0;
                workshopBadge.classList.add('visible');
                console.log('🧪 恢复工坊模式，激活关卡集:', activeCollection.meta.levelsName);
            } else {
                if (activeCollection) {
                    activeCollection.isActive = false;
                    saveWorkshopData();
                }
                loadUnlockedFromStorage();
                currentLevelIndex = 0;
                workshopBadge.classList.remove('visible');
            }
            loadLevel(currentLevelIndex);
            requestAnimationFrame(() => { resizeCanvas(); });
            if (animId) cancelAnimationFrame(animId);
            gameLoop();
            showMenu();
            updateSettingsInfo();
            renderWorkshopCards();
            updateWorkshopInfo();
            bindTouchEvents();
            setTimeout(() => {
                const toolbar = document.getElementById('toolbar'); if (toolbar) toolbar.style.width = toolbar
                    .offsetWidth + 'px';
            }, 100);
            console.log('🎮 游戏已启动，关卡数:', LEVELS.length);
            console.log('💡 可用命令: clearPass() 清除记录 | debug() 解锁所有关卡');
            console.log('💡 工坊数据已持久化存储，共', workshopCollections.length, '个关卡集');
            console.log('📐 Canvas 自适应已启用，像素匹配 wrapper 尺寸');
            console.log('🖐️ 触摸支持已启用 (长按工具拖拽，单指移动/缩放区域)');
        }

        fetch('level.gcms')
            .then(response => { if (!response.ok) throw new Error(`HTTP ${response.status}`); return response.json(); })
            .then(data => {
                if (Array.isArray(data) && data.length > 0) {
                    const levels = extractLevels(data);
                    if (levels.length > 0) {
                        console.log('✅ 成功加载外部关卡数据，共', levels.length, '关');
                        initGame(levels);
                    } else throw new Error('未找到有效关卡数据');
                } else throw new Error('数据格式错误');
            })
            .catch(err => {
                console.warn('⚠️ 关卡集加载失败:', err.message);
                initGame(DEFAULT_LEVELS);
                showToast('err on load levels: ' + err.message, 1200);
            });

        window.workshop = {
            collections: workshopCollections, import: importCollection, render: renderWorkshopCards,
            clear: clearAllCollections, save: saveWorkshopData, load: loadWorkshopData
        };
        console.log('🔧 工坊调试: window.workshop 可用');

        const catSounds = ["喵", "咪", "咪呜", "喵呜", "喵呀", "喵~", "喵呜~", "呜~~~喵", "呜喵", "咪呜咪呜", "咪呀！", "喵咦？", "咪咪咪",
            "喵喵喵喵喵", "喵嗷！", "嘶哈！", "呵——！", "嗷嗷嗷", "哇嗷——", "嗷呜嗷呜", "呜哇嗷！", "喵呜咦？", "喵嗷呜呜", "呃嗷...", "Meow",
            "Mew", "Mrrow", "Mreeeow", "Brrr", "咕噜噜", "咕噜咕噜"
        ];

        function neow() {
            const randomIndex = Math.floor(Math.random() * catSounds.length);
            console.log(`🐱 猫说：${catSounds[randomIndex]}`);
            showToast(`<i class="fas fa-paw"></i>猫说：${catSounds[randomIndex]}`);
        }

        document.addEventListener('click', () => {
            if (SoundManager.ctx && SoundManager.ctx.state === 'suspended') SoundManager
                .ctx.resume().catch(() => { });
        }, { once: false });

        // ================================================================
        //  新手教程 (触摸适配)
        // ================================================================
        (function () {
            'use strict';
            let tutorialCompleted;
            const CONFIG = {
                boxColor: '#4a9eff', boxBorderWidth: '2px', shadowColor: 'rgba(0, 0, 0, 0.82)',
                toastDuration: 5000, transitionDuration: 400, regionShowDuration: 4000, autoCloseDelay: 500
            };
            let isRunning = false,
                aborted = false,
                focusBox = null;
            const $ = (s) => document.querySelector(s);
            const sleep = (ms) => new Promise(r => setTimeout(r, ms));

            function getShadowSize() {
                const maxDim = Math.max(window.innerWidth, window.innerHeight); return Math.ceil(
                    maxDim * 1.8) + 'px';
            }

            function createFocusUI() {
                const container = document.createElement('div');
                container.id = 'tutorial-container';
                container.style.cssText =
                    `position: fixed; top:0; left:0; width:100%; height:100%; pointer-events: none; z-index: 10000; display: none;`;
                const box = document.createElement('div');
                box.id = 'tutorial-focus-box';
                box.style.cssText =
                    `position: absolute; border: ${CONFIG.boxBorderWidth} solid ${CONFIG.boxColor}; transition: all ${CONFIG.transitionDuration}ms ease; pointer-events: none; border-radius: 0 !important; background: transparent; z-index: 10001; box-sizing: border-box;`;
                container.appendChild(box);
                document.body.appendChild(container);
                return {
                    container,
                    box,
                    show() { container.style.display = 'block'; },
                    hide() { container.style.display = 'none'; },
                    updateShadow() {
                        const size = getShadowSize(); this.box.style.boxShadow =
                            `0 0 0 ${size} ${CONFIG.shadowColor}`;
                    },
                    focus(el, padding = 4) {
                        if (!el) { this.hide(); return; } this.updateShadow(); const rect = el
                            .getBoundingClientRect(); const p = padding; this.box.style.left = (rect.left + window
                                .scrollX - p) + 'px'; this.box.style.top = (rect.top + window.scrollY - p) +
                                    'px'; this.box.style.width = (rect.width + p * 2) + 'px'; this.box.style.height = (
                                        rect.height + p * 2) + 'px'; this.show();
                    },
                    focusScreen() {
                        this.updateShadow(); const w = window.innerWidth,
                            h = window.innerHeight,
                            p = 20; this.box.style.left = p + 'px'; this.box.style.top = p + 'px'; this.box.style
                                .width = (w - p * 2) + 'px'; this.box.style.height = (h - p * 2) + 'px'; this.show();
                    },
                    clear() {
                        this.hide(); this.box.style.left = '-9999px'; this.box.style.top = '-9999px'; this.box
                            .style.width = '0px'; this.box.style.height = '0px';
                    }
                };
            }

            function toast(msg, duration) {
                if (typeof window.showToast === 'function') window.showToast(msg, duration || CONFIG.toastDuration);
                else {
                    const div = document.createElement('div');
                    div.innerHTML = msg;
                    div.style.cssText =
                        `position: fixed; bottom: 30px; right: 10px; color: #e0e0f0; background: #00000060; padding: 8px 14px; font-size: 15px; font-weight: 600; z-index: 99999; border-radius: 3px; pointer-events: none; transition: opacity 0.3s ease; backdrop-filter: blur(2px);`;
                    document.body.appendChild(div);
                    setTimeout(() => {
                        div.style.opacity = '0';
                        setTimeout(() => div.remove(), 400);
                    }, duration || CONFIG.toastDuration);
                }
            }

            function setWorkshopVisible(visible) {
                const el = $('#workshopOverlay'); if (el) el.classList.toggle('visible',
                    visible);
            }

            function setSettingsVisible(visible) {
                const el = $('#settingsOverlay'); if (el) el.classList.toggle('visible',
                    visible);
            }

            function waitForTap(selector, timeout = 30000) {
                return new Promise((resolve, reject) => {
                    const el = $(selector);
                    if (!el) return reject(new Error(`元素未找到: ${selector}`));
                    let timer = setTimeout(() => {
                        el.removeEventListener('click', handler);
                        el.removeEventListener('touchstart', handler);
                        reject(new Error(`点击超时: ${selector}`));
                    }, timeout);

                    function handler(e) {
                        el.removeEventListener('click', handler);
                        el.removeEventListener('touchstart', handler);
                        clearTimeout(timer);
                        resolve(e);
                    }
                    el.addEventListener('click', handler);
                    el.addEventListener('touchstart', handler, { passive: true });
                });
            }

            async function focusAndWait(selector, message, padding = 4) {
                if (aborted) return; const el = $(selector); if (!el) {
                    console.warn(`[教程] 元素不存在: ${selector}`); return;
                } focusBox.focus(el, padding);
                toast(message, CONFIG.toastDuration);
                await waitForTap(selector);
            }

            async function focusAndShow(selector, message, padding = 4, duration = CONFIG.regionShowDuration) {
                if (aborted)
                    return; const el = $(selector); if (!el) { console.warn(`[教程] 元素不存在: ${selector}`); return; } focusBox
                        .focus(el, padding);
                toast(message, CONFIG.toastDuration);
                await sleep(duration);
            }

            async function focusScreen(message, duration = CONFIG.regionShowDuration) {
                if (aborted) return; focusBox
                    .focusScreen();
                toast(message, CONFIG.toastDuration);
                await sleep(duration);
            }

            function waitForGameEnd() {
                return new Promise((resolve) => {
                    if (typeof gameState === 'undefined') {
                        resolve(
                            'fail'); return;
                    } const checkState = () => {
                        const s = gameState; if (s === 'success' || s ===
                            'fail') { resolve(s); return; } setTimeout(checkState, 50);
                    }; checkState();
                });
            }

            async function startTutorial() {
                if (isRunning) return;
                if (localStorage.getItem('tutorialCompleted') === 'true') { console.log('欢迎回来，长官！'); return; }
                isRunning = true;
                aborted = false;
                const menu = $('#menuOverlay');
                if (menu) menu.classList.remove('hidden');
                setWorkshopVisible(false);
                setSettingsVisible(false);
                focusBox = createFocusUI();
                focusBox.clear();
                try {
                    await focusAndShow('#btnStartGame', '这里开启游戏，我们稍后进入', 6);
                    focusBox.clear();
                    await focusAndShow('#btnWorkshop', '这里打开工坊', 6);
                    btnWorkshop.click();
                    setWorkshopVisible(true);
                    await sleep(500);
                    await focusAndShow('#wsImportBtn', '点这里可以导入关卡集', 6);
                    btnWorkshop.click();
                    setWorkshopVisible(false);
                    focusBox.clear();
                    await sleep(500);
                    await focusAndShow('#btnSettings', '这里打开设置', 6);
                    btnSettings.click();
                    setSettingsVisible(true);
                    await sleep(300);
                    await focusAndShow('#uiScaleSlider', '你可以根据屏幕大小调整UI缩放，稍后你可以来这里调整', 6);
                    await focusAndShow('#SkipTutorial', '如果你不喜欢我的话，直接点这里关掉我', 6);
                    btnSettings.click();
                    setSettingsVisible(false);
                    focusBox.clear();
                    await sleep(300);
                    await focusAndWait('#btnStartGame', '现在请打开游戏', 6);
                    await sleep(800);
                    focusBox.clear();
                    await focusScreen('游戏界面分为 4 个主要区域', 3000);
                    await focusAndShow('.status-bar', '运行状态栏', 6);
                    await focusAndShow('#toolbar', '工具区', 6);
                    await focusAndShow('#levelSection', '关卡选择器', 6);
                    await focusAndShow('#infoBar', '信息栏', 6);
                    focusBox.clear();
                    await focusAndWait('#mainBtn', '▶ 点击「开始」模拟，观察小车运动', 6);
                    let endState;
                    endState = await waitForGameEnd();
                    if (window.gameState === 'running' && typeof window.stopSimulation === 'function') {
                        window
                            .stopSimulation();
                        await sleep(300);
                    }
                    focusBox.clear();
                    await focusScreen('没有工具的帮助，小车很快偏离道路，现在需要重置', 3000);
                    focusBox.clear();
                    await focusAndWait('#mainBtn', '点击「重置」按钮，回到布局状态', 6);
                    await sleep(500);
                    focusBox.clear();
                    await sleep(500);
                    await focusAndShow('#toolbar', '从左侧拖拽「引力场」到画布上，帮助小车通过', 3);
                    await sleep(500);
                    await focusAndShow('#mainBtn', '▶ 布置好工具后，再次点击「开始」模拟', 6);
                    focusBox.clear();
                    await waitForTap('#mainBtn');
                    await sleep(500);
                    await waitForGameEnd();
                    const isSuccess = (window.gameState === 'success');
                    const msg = isSuccess ?
                        '恭喜你，我觉得你已经知道这个游戏的基本操作了，教程已结束[泪目散花]' :
                        '恭喜你，我觉得你已经知道这个游戏的基本操作了，尽管你仍然失败了，不过我的任务已经完成，所以教程已结束[泪目散花]';
                    await focusScreen(msg, 5000);
                    await sleep(3000);
                    focusBox.clear();
                    tutorialCompleted = true;
                } catch (err) {
                    console.warn('[教程] 出错:', err);
                    toast('教程中断: ' + err.message, 3000);
                } finally {
                    if (focusBox) {
                        focusBox.clear();
                        focusBox.hide(); const container = document.getElementById('tutorial-container'); if (container)
                            container.remove();
                    }
                    isRunning = false;
                    aborted = false;
                    setWorkshopVisible(false);
                    setSettingsVisible(false);
                    const menu = $('#menuOverlay');
                    if (menu) menu.classList.remove('hidden');
                    toast('教程已结束，祝你玩得开心！', 2000);
                    if (tutorialCompleted == true) {
                        localStorage.setItem('tutorialCompleted', 'true');
                    }
                    window.updateSkipCheckbox();
                }
            }
            window.Tutorial = { start: startTutorial, isRunning: () => isRunning, abort: () => { aborted = true; } };
            console.log('🧭 新手教程已加载 (触摸适配)，输入 Tutorial.start() 启动');
        })();
        setTimeout(() => { window.Tutorial.start(); }, 900);
        // ============================================================
        //  🎮 跳过教程开关 · 双向绑定 + 存储同步
        // ============================================================
        (function syncSkipTutorial() {
            const checkbox = document.getElementById('SkipTutorial');
            if (!checkbox) return;
            function updateCheckboxFromStorage() {
                const isCompleted = localStorage.getItem('tutorialCompleted') === 'true';
                checkbox.checked = isCompleted;
            }
            window.updateSkipCheckbox = updateCheckboxFromStorage;
            updateCheckboxFromStorage();
            checkbox.addEventListener('change', function () {
                if (this.checked) {
                    localStorage.setItem('tutorialCompleted', 'true');
                    // 如果教程正在运行，中断它
                    if (window.Tutorial && window.Tutorial.isRunning && window.Tutorial.isRunning()) {
                        window.Tutorial.abort();
                        // 清理残留 UI
                        document.querySelectorAll('#tutorial-container, #tutorial-focus-box').forEach(el => el.remove());
                    }
                    showToast(`<i class="fas fa-check-circle"></i> 教程已跳过`, 1200);
                } else {
                    localStorage.setItem('tutorialCompleted', 'false');
                    showToast(`<i class="fas fa-info-circle"></i> 教程已启用，下次进入游戏将重新播放`, 1500);
                }
            });

            console.log('✅ 跳过教程开关已同步 localStorage');
        })();
    </script>
</body>
