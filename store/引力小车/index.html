            btnNextLevel.title = nextIdx < LEVELS.length ? (nextIdx <= unlockedLevelIndex || isWorkshopMode ? '下一关 (→)' :
                '🔒 未解锁') : '已是最后一关';
            updateLevelCounter();
        }

        function updateUI() {
            updateCountUI();
            const spd = car.speed;
            speedDisplayEl.innerHTML =
                `<span class="icon"><i class="fas fa-gauge-high"></i></span> 速度: <span class="value">${spd.toFixed(2)}</span>`;
            const prog = getProgress();
            const pct = Math.round(prog * 100);
            progressFill.style.width = pct + '%';
            progressText.textContent = pct + '%';
            updateCheckpointUI();
        }

        function resetAllRings() {
            for (const f of fields) {
                f.ringProgress = new Array(NUM_RINGS).fill(0);
                f.activationState = 'idle';
                f.activationIndex = 0;
                f.deactivationIndex = NUM_RINGS - 1;
            }
        }

        function updateFieldStrength(field) {
            field.strength = field.radius * GRAVITY_COEFF;
            field.color =
                `hsl(${220 - clamp(field.strength * 8, 0, 180)}, 80%, ${55 + clamp(field.strength * 2, 0, 30)}%)`;
        }

        function updateBoostStrength(zone) { zone.strength = zone.radius * BOOST_COEFF; }

        function updateBrakeStrength(zone) { zone.strength = zone.radius * BRAKE_COEFF; }

        // ---------- Toast ----------
        const BASE_BOTTOM = 30,
            GAP = 2,
            TOAST_HEIGHT = 40;
        let activeToasts = [];

        function updatePositions() {
            activeToasts.forEach((el, index) => {
                const bottom = BASE_BOTTOM + index * (TOAST_HEIGHT +
                    GAP);
                el.style.bottom = bottom + 'px';
            });
        }

        function showToast(msg, duration = 2000) {
            SoundManager.play('showToast');
            const div = document.createElement('div');
            div.className = 'toast-msg';
            div.innerHTML = msg;
            document.body.appendChild(div);
            activeToasts.unshift(div);
            updatePositions();
            const timer = setTimeout(() => { hideToast(div); }, duration);
            div._timer = timer;
        }

        function hideToast(el) {
            if (!el || el._hidden) return;
            el._hidden = true;
            el.classList.add('hide');
            const onTransitionEnd = () => {
                el.removeEventListener('transitionend', onTransitionEnd);
                const index = activeToasts.indexOf(el);
                if (index !== -1) { activeToasts.splice(index, 1); }
                updatePositions();
                el.remove();
            };
            el.addEventListener('transitionend', onTransitionEnd);
            setTimeout(() => {
                if (el.parentNode) {
                    const idx = activeToasts.indexOf(el);
                    if (idx !== -1) {
                        activeToasts.splice(idx, 1);
                        updatePositions();
                    }
                    el.remove();
                }
            }, 500);
        }

        // ---------- 轨迹采样 ----------
        function drawSampledTrail(trail, step) {
            if (!trail || trail.length < 2) return;
            const len = trail.length;
            const actualStep = Math.max(1, step || 1);
            if (len <= actualStep * 2) {
                ctx.beginPath();
                ctx.moveTo(trail[0].x, trail[0].y);
                for (let i = 1; i < len; i++) ctx.lineTo(trail[i].x, trail[i].y);
                ctx.stroke();
                return;
            }
            ctx.beginPath();
            ctx.moveTo(trail[0].x, trail[0].y);
            for (let i = actualStep; i < len; i += actualStep) ctx.lineTo(trail[i].x, trail[i].y);
            const lastIdx = len - 1;
            if ((len - 1) % actualStep !== 0) ctx.lineTo(trail[lastIdx].x, trail[lastIdx].y);
            ctx.stroke();
        }

        // ---------- 更新引力场波纹 ----------
        function updateFieldRings(field, isAffecting) {
            const num = field.numRings;
            const speed = field.ringSpeed * 0.02;
            if (isAffecting) {
                if (field.activationState === 'idle') {
                    field.activationState = 'activating';
                    field.activationIndex = 0;
                } else if (field.activationState === 'deactivating') {
                    field.activationState = 'activating';
                    let idx = 0;
                    while (idx < num && field.ringProgress[idx] >= 1) idx++;
                    field.activationIndex = (idx < num) ? idx : num;
                    if (field.activationIndex >= num) field.activationState = 'active';
                } else if (field.activationState === 'activating') {
                    const idx = field.activationIndex;
                    if (idx < num) {
                        field.ringProgress[idx] = Math.min(1, field.ringProgress[idx] + speed);
                        if (field.ringProgress[idx] >= 1) {
                            field.activationIndex++;
                            if (field.activationIndex >= num) field.activationState = 'active';
                        }
                    }
                }
            } else {
                if (field.activationState === 'active') {
                    field.activationState = 'deactivating';
                    field.deactivationIndex = num - 1;
                } else if (field.activationState === 'activating') {
                    field.activationState = 'deactivating';
                    let lastActive = 0;
                    for (let i = 0; i < num; i++) { if (field.ringProgress[i] > 0) lastActive = i; }
                    field.deactivationIndex = lastActive;
                } else if (field.activationState === 'deactivating') {
                    const idx = field.deactivationIndex;
                    if (idx >= 0) {
                        field.ringProgress[idx] = Math.max(0, field.ringProgress[idx] - speed);
                        if (field.ringProgress[idx] <= 0) {
                            field.deactivationIndex--;
                            if (field.deactivationIndex < 0) field.activationState = 'idle';
                        }
                    }
                }
            }
        }

        // ============================================================
        //  Canvas 自适应
        // ============================================================
        let transform = { scale: 1, offsetX: 0, offsetY: 0 };

        function updateTransform() {
            const cw = canvas.width,
                ch = canvas.height;
            if (cw === 0 || ch === 0) {
                transform.scale = 1;
                transform.offsetX = 0;
                transform.offsetY = 0; return;
            }
            const scaleX = cw / W,
                scaleY = ch / H;
            const s = Math.min(scaleX, scaleY);
            transform.scale = s;
            transform.offsetX = (cw - W * s) / 2;
            transform.offsetY = (ch - H * s) / 2;
        }

        function screenToGame(sx, sy) {
            const s = transform.scale,
                ox = transform.offsetX,
                oy = transform.offsetY;
            if (s === 0) return { x: 0, y: 0 };
            return { x: (sx - ox) / s, y: (sy - oy) / s };
        }

        function gameToScreen(gx, gy) {
            const s = transform.scale,
                ox = transform.offsetX,
                oy = transform.offsetY;
            return { x: gx * s + ox, y: gy * s + oy };
        }

        function resizeCanvas() {
            const rect = wrapper.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            const w = Math.floor(rect.width * dpr),
                h = Math.floor(rect.height * dpr);
            if (w === 0 || h === 0) return;
            if (canvas.width !== w || canvas.height !== h) {
                canvas.width = w;
                canvas.height = h;
            }
            canvas.style.width = '100%';
            canvas.style.height = '100%';
            updateTransform();
            draw();
        }
        if (window.ResizeObserver) {
            const ro = new ResizeObserver(() => { resizeCanvas(); });
            ro.observe(wrapper);
        }
        window.addEventListener('resize', resizeCanvas);

        function getMousePos(e) {
            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;
            if (e.touches && e.touches.length > 0) {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else if (e.changedTouches && e.changedTouches.length > 0) {
                clientX = e
                    .changedTouches[0].clientX;
                clientY = e.changedTouches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            const sx = (clientX - rect.left) * (canvas.width / rect.width);
            const sy = (clientY - rect.top) * (canvas.height / rect.height);
            const g = screenToGame(sx, sy);
            return { x: g.x, y: g.y, screenX: sx, screenY: sy };
        }

        // ============================================================
        //  UI 缩放
        // ============================================================
        let uiScaleFactor = 1;
        const originalFontSizes = new Map();

        function applyUIScale() {
            const scale = uiScaleFactor;
            const topbar = document.getElementById('topbar');
            if (topbar) {
                topbar.style.transform = `scale(${scale})`;
                topbar.style.transformOrigin = 'left top';
            }
            const menuOverlay = document.getElementById('menuOverlay');
            if (menuOverlay) menuOverlay.style.zoom = scale;
            const infoBar = document.getElementById('infoBar');
            if (infoBar) {
                let base = originalFontSizes.get(infoBar);
                if (!base) {
                    const computed = window.getComputedStyle(infoBar).fontSize;
                    const px = parseFloat(computed);
                    if (!isNaN(px) && px > 0) {
                        base = px;
                        originalFontSizes.set(infoBar, base);
                    } else base = 12;
                }
                infoBar.style.fontSize = (base * scale) + 'px';
                const targets = infoBar.querySelectorAll('.info-item, .progress-wrap, .checkpoint-info, .workshop-badge');
                targets.forEach(el => {
                    let orig = originalFontSizes.get(el);
                    if (!orig) {
                        const computed = window.getComputedStyle(el).fontSize;
                        const px = parseFloat(computed);
                        if (!isNaN(px) && px > 0) {
                            orig = px;
                            originalFontSizes.set(el, orig);
                        } else return;
                    }
                    el.style.fontSize = (orig * scale) + 'px';
                });
                const barLabel = infoBar.querySelector('.bar-label');
                if (barLabel) {
                    let orig = originalFontSizes.get(barLabel);
                    if (!orig) {
                        const computed = window.getComputedStyle(barLabel).fontSize;
                        const px = parseFloat(computed);
                        if (!isNaN(px) && px > 0) {
                            orig = px;
                            originalFontSizes.set(barLabel, orig);
                        }
                    }
                    if (orig) barLabel.style.fontSize = (orig * scale) + 'px';
                }
                const cpSpans = infoBar.querySelectorAll('.cp-passed, .cp-total');
                cpSpans.forEach(el => {
                    let orig = originalFontSizes.get(el);
                    if (!orig) {
                        const computed = window.getComputedStyle(el).fontSize;
                        const px = parseFloat(computed);
                        if (!isNaN(px) && px > 0) {
                            orig = px;
                            originalFontSizes.set(el, orig);
                        } else return;
                    }
                    el.style.fontSize = (orig * scale) + 'px';
                });
            }
        }

        function saveUIScale() { try { localStorage.setItem(UI_SCALE_STORAGE_KEY, String(uiScaleFactor)); } catch (_) { } }

        function restoreUIScale() {
            try {
                const saved = localStorage.getItem(UI_SCALE_STORAGE_KEY);
                if (saved !== null) {
                    const val = parseFloat(saved);
                    if (!isNaN(val) && val >= 1 && val <= 4) {
                        uiScaleFactor = val; if (uiScaleSlider) uiScaleSlider.value =
                            val; if (uiScaleValue) uiScaleValue.textContent = val;
                        applyUIScale(); return;
                    }
                }
            } catch (_) { }
            uiScaleFactor = 1;
            if (uiScaleSlider) uiScaleSlider.value = 1;
            if (uiScaleValue) uiScaleValue.textContent = 1;
            applyUIScale();
        }

        if (uiScaleSlider && uiScaleValue) {
            uiScaleSlider.addEventListener('input', function () {
                let val = parseFloat(this.value);
                if (isNaN(val) || val < 1) val = 1;
                if (val > 4) val = 4;
                this.value = val;
                uiScaleValue.textContent = val;
            });
            uiScaleSlider.addEventListener('change', function () {
                let val = parseFloat(this.value);
                if (isNaN(val) || val < 1) {
                    this.value = 1;
                    val = 1;
                }
                if (val > 4) {
                    this.value = 4;
                    val = 4;
                }
                uiScaleValue.textContent = val;
                uiScaleFactor = val;
                applyUIScale();
                saveUIScale();
            });
        }

        // ============================================================
        //  绘制函数
        // ============================================================
        function draw() {
            updateParticles(0.02);
            animTime += 0.02;
            if (gameState === STATE.RUNNING) {
                for (const z of brakeZones) {
                    const dist = distance(car.x, car.y, z.cx, z.cy);
                    if (dist < z.radius && car.speed > 0.3) { spawnSparks(car.x, car.y, 1); break; }
                }
            }
            updateAnimations(0.02);

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#2d5a2d';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.save();
            const s = transform.scale,
                ox = transform.offsetX,
                oy = transform.offsetY;
            ctx.translate(ox, oy);
            ctx.scale(s, s);

            if (pathPoints.length > 1) {
                ctx.beginPath();
                ctx.moveTo(pathPoints[0].x, pathPoints[0].y);
                for (let i = 1; i < pathPoints.length; i++) ctx.lineTo(pathPoints[i].x, pathPoints[i].y);
                ctx.strokeStyle = '#1a3a1a';
                ctx.lineWidth = PATH_WIDTH * 2 + 6;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(pathPoints[0].x, pathPoints[0].y);
                for (let i = 1; i < pathPoints.length; i++) ctx.lineTo(pathPoints[i].x, pathPoints[i].y);
                ctx.strokeStyle = '#3a5a3a';
                ctx.lineWidth = PATH_WIDTH * 2;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                ctx.stroke();

                ctx.strokeStyle = '#7a9a7a';
                ctx.lineWidth = 2;
                ctx.setLineDash([8, 12]);
                ctx.beginPath();
                ctx.moveTo(pathPoints[0].x, pathPoints[0].y);
                for (let i = 1; i < pathPoints.length; i++) ctx.lineTo(pathPoints[i].x, pathPoints[i].y);
                ctx.stroke();
                ctx.setLineDash([]);

                if (startPulseActive) {
                    const progress = startPulseProgress;
                    const radius = progress * 200;
                    const alpha = (1 - progress) * 0.6;
                    ctx.strokeStyle = `rgba(200, 230, 255, ${alpha})`;
                    ctx.lineWidth = 1 + (1 - progress) * 4;
                    ctx.shadowColor = `rgba(200, 230, 255, ${alpha * 0.3})`;
                    ctx.shadowBlur = 12;
                    ctx.beginPath();
                    ctx.arc(startPos.x, startPos.y, radius, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }

                ctx.font = '900 20px "Font Awesome 6 Free"';
                ctx.fillStyle = '#ffcc66';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('\uf024', startPos.x, startPos.y - 10);
                ctx.font = '12px "Segoe UI", Arial, sans-serif';
                ctx.fillStyle = 'rgba(255,200,100,0.7)';
                ctx.textBaseline = 'top';
                ctx.fillText('起点', startPos.x, startPos.y + 18);

                const endX = endPos.x,
                    endY = endPos.y;
                const grd = ctx.createRadialGradient(endX, endY, 0, endX, endY, TARGET_RADIUS * 2.2);
                grd.addColorStop(0, 'rgba(96, 165, 250, 0.3)');
                grd.addColorStop(0.4, 'rgba(96, 165, 250, 0.1)');
                grd.addColorStop(1, 'rgba(96, 165, 250, 0)');
                ctx.fillStyle = grd;
                ctx.beginPath();
                ctx.arc(endX, endY, TARGET_RADIUS * 2.2, 0, Math.PI * 2);
                ctx.fill();

                ctx.font = '900 24px "Font Awesome 6 Free"';
                ctx.fillStyle = '#60a5fa';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = 'rgba(96, 165, 250, 0.4)';
                ctx.shadowBlur = 20;
                ctx.fillText('\uf11e', endX, endY - 6);
                ctx.shadowBlur = 0;
                ctx.font = '12px "Segoe UI", Arial, sans-serif';
                ctx.fillStyle = 'rgba(255,255,255,0.6)';
                ctx.textBaseline = 'top';
                ctx.fillText('终点', endX, endY + 22);

                for (let i = 0; i < checkpoints.length; i++) {
                    const cp = checkpoints[i];
                    const isPassed = cp.passed;
                    const radius = cp.radius;
                    const gradCp = ctx.createRadialGradient(cp.x, cp.y, 0, cp.x, cp.y, radius * 2);
                    if (isPassed) {
                        gradCp.addColorStop(0, 'rgba(52, 211, 153, 0.25)');
                        gradCp.addColorStop(1, 'rgba(52, 211, 153, 0)');
                    } else {
                        gradCp.addColorStop(0,
                            'rgba(96, 165, 250, 0.2)');
                        gradCp.addColorStop(1, 'rgba(96, 165, 250, 0)');
                    }
                    ctx.fillStyle = gradCp;
                    ctx.beginPath();
                    ctx.arc(cp.x, cp.y, radius * 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.strokeStyle = isPassed ? 'rgba(52, 211, 153, 0.8)' : 'rgba(96, 165, 250, 0.7)';
                    ctx.lineWidth = isPassed ? 3 : 2;
                    ctx.setLineDash(isPassed ? [] : [4, 6]);
                    ctx.beginPath();
                    ctx.arc(cp.x, cp.y, radius, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    ctx.strokeStyle = isPassed ? 'rgba(52, 211, 153, 0.4)' : 'rgba(96, 165, 250, 0.3)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.arc(cp.x, cp.y, radius * 0.6, 0, Math.PI * 2);
                    ctx.stroke();
                    if (isPassed) {
                        ctx.font = '900 18px "Font Awesome 6 Free"';
                        ctx.fillStyle = 'rgba(52, 211, 153, 0.9)';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('\uf00c', cp.x, cp.y + 1);
                    } else {
                        ctx.fillStyle = 'rgba(96, 165, 250, 0.7)';
                        ctx.beginPath();
                        ctx.arc(cp.x, cp.y, 4, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.font = '10px "Segoe UI", monospace';
                    ctx.fillStyle = isPassed ? 'rgba(52, 211, 153, 0.6)' : 'rgba(255,255,255,0.3)';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'top';
                    ctx.fillText(`CP${i + 1}`, cp.x, cp.y + radius + 8);
                }

                for (const en of enemies) {
                    const ex = en.currentX,
                        ey = en.currentY,
                        radius = en.radius;
                    const distToCar = distance(car.x, car.y, ex, ey);
                    const danger = clamp(1 - distToCar / 400, 0, 1);
                    const pulseFreq = 1.5 + danger * 2;
                    const pulse = 0.8 + 0.2 * Math.sin(animTime * pulseFreq + en.x);
                    const gradEn = ctx.createRadialGradient(ex, ey, 0, ex, ey, radius * 2.5 * pulse);
                    gradEn.addColorStop(0, `rgba(248, 113, 113, ${0.1 + danger * 0.2})`);
                    gradEn.addColorStop(0.5, `rgba(248, 113, 113, ${0.05 + danger * 0.1})`);
                    gradEn.addColorStop(1, 'rgba(248, 113, 113, 0)');
                    ctx.fillStyle = gradEn;
                    ctx.beginPath();
                    ctx.arc(ex, ey, radius * 2.5 * pulse, 0, Math.PI * 2);
                    ctx.fill();
                    if (gameState === STATE.RUNNING && distToCar < 500) {
                        const lineAlpha = clamp(1 - distToCar / 500, 0.1, 0.6) * 0.5;
                        ctx.strokeStyle = `rgba(255, 80, 80, ${lineAlpha})`;
                        ctx.lineWidth = 1.5;
                        ctx.setLineDash([4, 6]);
                        ctx.beginPath();
                        ctx.moveTo(ex, ey);
                        ctx.lineTo(car.x, car.y);
                        ctx.stroke();
                        ctx.setLineDash([]);
                        const dx = car.x - ex,
                            dy = car.y - ey;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        if (dist > 20) {
                            const arrowLen = 12,
                                nx = dx / dist,
                                ny = dy / dist;
                            const ax = ex + nx * radius * 1.2,
                                ay = ey + ny * radius * 1.2;
                            ctx.fillStyle = `rgba(255, 80, 80, ${lineAlpha * 1.2})`;
                            ctx.beginPath();
                            ctx.moveTo(ax + nx * arrowLen, ay + ny * arrowLen);
                            ctx.lineTo(ax + nx * arrowLen * 0.4 + ny * 5, ay + ny * arrowLen * 0.4 - nx * 5);
                            ctx.lineTo(ax + nx * arrowLen * 0.4 - ny * 5, ay + ny * arrowLen * 0.4 + nx * 5);
                            ctx.closePath();
                            ctx.fill();
                        }
                    }
                    const colorIntensity = 0.7 + danger * 0.3;
                    ctx.shadowColor = `rgba(248, 113, 113, ${0.3 + danger * 0.4})`;
                    ctx.shadowBlur = 20 + danger * 20;
                    ctx.fillStyle =
                        `rgb(${Math.floor(200 + 55 * colorIntensity)}, ${Math.floor(60 - 20 * colorIntensity)}, ${Math.floor(60 - 20 * colorIntensity)})`;
                    ctx.beginPath();
                    ctx.arc(ex, ey, radius, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    if (danger > 0.3) {
                        ctx.strokeStyle = `rgba(255, 100, 100, ${danger * 0.5})`;
                        ctx.lineWidth = 1.5 + danger * 1.5;
                        ctx.beginPath();
                        ctx.arc(ex, ey, radius + 2, 0, Math.PI * 2);
                        ctx.stroke();
                    }
                    ctx.font = `900 ${18 + danger * 4}px "Font Awesome 6 Free"`;
                    ctx.fillStyle = 'rgba(255,255,255,0.9)';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText('\uf54c', ex, ey + 1);
                    ctx.font = '8px "Segoe UI", monospace';
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'top';
                    ctx.fillText(`⚡${en.speed.toFixed(1)}`, ex, ey + radius + 6);
                    if (en.trail && en.trail.length > 1) {
                        for (let i = 0; i < en.trail.length - 1; i++) {
                            const t = i / en.trail.length;
                            const alpha = t * 0.3;
                            ctx.strokeStyle = `rgba(255, 100, 100, ${alpha})`;
                            ctx.lineWidth = 1;
                            ctx.beginPath();
                            ctx.moveTo(en.trail[i].x, en.trail[i].y);
                            ctx.lineTo(en.trail[i + 1].x, en.trail[i + 1].y);
                            ctx.stroke();
                        }
                    }
                }
            }

            const isRunning = (gameState === STATE.RUNNING);
            const isFinished = (gameState === STATE.SUCCESS || gameState === STATE.FAIL);

            for (const z of boostZones) {
                const anim = getAnimTransform(z);
                if (anim.alpha < 0.01) continue;
                const isSelected = (selectedBoost === z);
                const distToCar = distance(car.x, car.y, z.cx, z.cy);
                const isAffecting = (distToCar < z.radius);
                const radius = z.radius;
                let isLit = false;
                if (isRunning && isAffecting) isLit = true;
                let fillAlpha = isSelected ? 0.35 : 0.2;
                let borderAlpha = isSelected ? 0.9 : 0.5;
                if (isRunning) {
                    if (isLit) {
                        fillAlpha = 0.5;
                        borderAlpha = 0.9;
                    } else {
                        fillAlpha = 0.08;
                        borderAlpha = 0.15;
                    }
                }
                ctx.save();
                ctx.globalAlpha = anim.alpha;
                ctx.translate(z.cx, z.cy);
                ctx.scale(anim.scale, anim.scale);
                ctx.translate(-z.cx, -z.cy);
                const gradBoost = ctx.createRadialGradient(z.cx, z.cy, 0, z.cx, z.cy, radius);
                gradBoost.addColorStop(0, `rgba(74, 222, 128, ${fillAlpha})`);
                gradBoost.addColorStop(0.7, `rgba(74, 222, 128, ${fillAlpha * 0.6})`);
                gradBoost.addColorStop(1, 'rgba(74, 222, 128, 0)');
                ctx.fillStyle = gradBoost;
                ctx.beginPath();
                ctx.arc(z.cx, z.cy, radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = isSelected ? `rgba(74, 222, 128, ${borderAlpha})` :
                    `rgba(74, 222, 128, ${borderAlpha})`;
                ctx.lineWidth = isSelected ? 3 : 2;
                ctx.setLineDash(isSelected ? [] : [5, 7]);
                ctx.beginPath();
                ctx.arc(z.cx, z.cy, radius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.font = '900 18px "Font Awesome 6 Free"';
                ctx.fillStyle = isLit ? `rgba(74, 222, 128, 0.95)` : `rgba(74, 222, 128, ${isRunning ? 0.2 : 0.7})`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('\uf0e7', z.cx, z.cy + 1);
                if (z.builtIn) {
                    ctx.font = '900 14px "Font Awesome 6 Free"';
                    ctx.fillStyle = 'rgba(255, 215, 0, 0.85)';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    const lockX = z.cx + z.radius * 0.55,
                        lockY = z.cy - z.radius * 0.55;
                    ctx.fillText('\uf023', lockX, lockY);
                }
                ctx.font = '9px "Segoe UI", monospace';
                ctx.fillStyle = isLit ? `rgba(74, 222, 128, 0.7)` :
                    `rgba(74, 222, 128, ${isRunning ? 0.15 : 0.4})`;
                ctx.textBaseline = 'top';
                ctx.fillText(`加速 r=${Math.round(radius)}`, z.cx, z.cy + radius + 8);

                if (isRunning && isLit) {
                    const speed = car.speed;
                    let dirX = 1,
                        dirY = 0;
                    if (speed > 0.1) {
                        dirX = car.vx / speed;
                        dirY = car.vy / speed;
                    } else {
                        const a = car.angle;
                        dirX = Math.cos(a);
                        dirY = Math.sin(a); if (Math.abs(dirX) < 0.01 && Math.abs(dirY) < 0.01) dirX = 1;
                    }
                    const perpX = -dirY,
                        perpY = dirX;
                    const numLines = 10;
                    const spacing = radius * 2 / (numLines + 1);
                    const moveSpeed = Math.max(0.3, speed * 0.15);
                    const offset = (animTime * moveSpeed) % spacing;
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(z.cx, z.cy, radius, 0, Math.PI * 2);
                    ctx.clip();
                    const lineAlpha = 0.25 + Math.min(0.3, speed * 0.02);
                    ctx.strokeStyle = `rgba(74, 222, 128, ${lineAlpha})`;
                    ctx.lineWidth = 1.5;
                    const halfLen = radius * 1.3;
                    for (let i = 0; i < numLines + 2; i++) {
                        const t = (i - 1) * spacing + offset - radius;
                        const px = z.cx + t * dirX,
                            py = z.cy + t * dirY;
                        ctx.beginPath();
                        ctx.moveTo(px + perpX * halfLen, py + perpY * halfLen);
                        ctx.lineTo(px - perpX * halfLen, py - perpY * halfLen);
                        ctx.stroke();
                    }
                    ctx.strokeStyle = `rgba(74, 222, 128, ${lineAlpha * 0.4})`;
                    ctx.lineWidth = 0.8;
                    for (let i = 0; i < numLines + 2; i++) {
                        const t = (i - 1) * spacing + offset - radius + spacing * 0.5;
                        const px = z.cx + t * dirX,
                            py = z.cy + t * dirY;
                        ctx.beginPath();
                        ctx.moveTo(px + perpX * halfLen * 0.9, py + perpY * halfLen * 0.9);
                        ctx.lineTo(px - perpX * halfLen * 0.9, py - perpY * halfLen * 0.9);
                        ctx.stroke();
                    }
                    ctx.restore();
                    ctx.strokeStyle = `rgba(74, 222, 128, 0.15)`;
                    ctx.lineWidth = 2;
                    ctx.shadowColor = 'rgba(74, 222, 128, 0.2)';
                    ctx.shadowBlur = 25;
                    ctx.beginPath();
                    ctx.arc(z.cx, z.cy, radius, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }

                if (isSelected) {
                    ctx.strokeStyle = 'rgba(74, 222, 128, 0.4)';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([3, 5]);
                    ctx.beginPath();
                    ctx.arc(z.cx, z.cy, radius + 5, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    ctx.fillStyle = 'rgba(74, 222, 128, 0.9)';
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = 'rgba(74, 222, 128, 0.3)';
                    ctx.beginPath();
                    ctx.arc(z.cx, z.cy, 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    const angle = Math.PI / 4;
                    const hx = z.cx + radius * Math.cos(angle),
                        hy = z.cy + radius * Math.sin(angle);
                    ctx.fillStyle = 'rgba(74, 222, 128, 0.8)';
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = 'rgba(74, 222, 128, 0.3)';
                    ctx.beginPath();
                    ctx.arc(hx, hy, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'rgba(255,255,255,0.15)';
                    ctx.font = '10px "Segoe UI", Arial, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText('移动', z.cx, z.cy - radius - 12);
                    ctx.fillText('缩放', hx, hy - 12);
                }
                ctx.restore();
            }

            for (const z of brakeZones) {
                const anim = getAnimTransform(z);
                if (anim.alpha < 0.01) continue;
                const isSelected = (selectedBrake === z);
                const distToCar = distance(car.x, car.y, z.cx, z.cy);
                const isAffecting = (distToCar < z.radius);
                const radius = z.radius;
                let isLit = false;
                if (isRunning && isAffecting) isLit = true;
                let fillAlpha = isSelected ? 0.35 : 0.2;
                let borderAlpha = isSelected ? 0.9 : 0.5;
                if (isRunning) {
                    if (isLit) {
                        fillAlpha = 0.5;
                        borderAlpha = 0.9;
                    } else {
                        fillAlpha = 0.08;
                        borderAlpha = 0.15;
                    }
                }
                ctx.save();
                ctx.globalAlpha = anim.alpha;
                ctx.translate(z.cx, z.cy);
                ctx.scale(anim.scale, anim.scale);
                ctx.translate(-z.cx, -z.cy);
                const gradBrake = ctx.createRadialGradient(z.cx, z.cy, 0, z.cx, z.cy, radius);
                gradBrake.addColorStop(0, `rgba(248, 113, 113, ${fillAlpha})`);
                gradBrake.addColorStop(0.7, `rgba(248, 113, 113, ${fillAlpha * 0.6})`);
                gradBrake.addColorStop(1, 'rgba(248, 113, 113, 0)');
                ctx.fillStyle = gradBrake;
                ctx.beginPath();
                ctx.arc(z.cx, z.cy, radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.strokeStyle = isSelected ? `rgba(248, 113, 113, ${borderAlpha})` :
                    `rgba(248, 113, 113, ${borderAlpha})`;
                ctx.lineWidth = isSelected ? 3 : 2;
                ctx.setLineDash(isSelected ? [] : [5, 7]);
                ctx.beginPath();
                ctx.arc(z.cx, z.cy, radius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.font = '900 18px "Font Awesome 6 Free"';
                ctx.fillStyle = isLit ? `rgba(248, 113, 113, 0.95)` : `rgba(248, 113, 113, ${isRunning ? 0.2 : 0.7})`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('\uf071', z.cx, z.cy + 1);
                if (z.builtIn) {
                    ctx.font = '900 14px "Font Awesome 6 Free"';
                    ctx.fillStyle = 'rgba(255, 215, 0, 0.85)';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    const lockX = z.cx + z.radius * 0.55,
                        lockY = z.cy - z.radius * 0.55;
                    ctx.fillText('\uf023', lockX, lockY);
                }
                ctx.font = '9px "Segoe UI", monospace';
                ctx.fillStyle = isLit ? `rgba(248, 113, 113, 0.7)` :
                    `rgba(248, 113, 113, ${isRunning ? 0.15 : 0.4})`;
                ctx.textBaseline = 'top';
                ctx.fillText(`刹车 r=${Math.round(radius)}`, z.cx, z.cy + radius + 8);
                if (isLit) {
                    ctx.strokeStyle = 'rgba(248, 113, 113, 0.15)';
                    ctx.lineWidth = 2;
                    ctx.shadowColor = 'rgba(248, 113, 113, 0.2)';
                    ctx.shadowBlur = 25;
                    ctx.beginPath();
                    ctx.arc(z.cx, z.cy, radius, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                }
                if (isSelected) {
                    ctx.strokeStyle = 'rgba(248, 113, 113, 0.4)';
                    ctx.lineWidth = 1;
                    ctx.setLineDash([3, 5]);
                    ctx.beginPath();
                    ctx.arc(z.cx, z.cy, radius + 5, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    ctx.fillStyle = 'rgba(248, 113, 113, 0.9)';
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = 'rgba(248, 113, 113, 0.3)';
                    ctx.beginPath();
                    ctx.arc(z.cx, z.cy, 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    const angle = Math.PI / 4;
                    const hx = z.cx + radius * Math.cos(angle),
                        hy = z.cy + radius * Math.sin(angle);
                    ctx.fillStyle = 'rgba(248, 113, 113, 0.8)';
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = 'rgba(248, 113, 113, 0.3)';
                    ctx.beginPath();
                    ctx.arc(hx, hy, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'rgba(255,255,255,0.15)';
                    ctx.font = '10px "Segoe UI", Arial, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText('移动', z.cx, z.cy - radius - 12);
                    ctx.fillText('缩放', hx, hy - 12);
                }
                ctx.restore();
            }

            drawParticles();

            for (const f of fields) {
                const anim = getAnimTransform(f);
                if (anim.alpha < 0.01) continue;
                const isSelected = (selectedField === f);
                const distToCar = distance(car.x, car.y, f.cx, f.cy);
                const isAffecting = (distToCar <= f.radius);
                const currentRadius = f.radius;
                const hue = 210 + clamp(f.strength * 20, 0, 80);

                if (isRunning) updateFieldRings(f, isAffecting);
                else if (f.activationState !== 'idle') {
                    f.ringProgress = new Array(NUM_RINGS).fill(0);
                    f.activationState = 'idle';
                    f.activationIndex = 0;
                    f.deactivationIndex = NUM_RINGS - 1;
                }

                let showFill = true;
                if (isRunning) showFill = isAffecting;
                else if (isFinished) showFill = true;
                else showFill = true;

                ctx.save();
                ctx.globalAlpha = anim.alpha;
                ctx.translate(f.cx, f.cy);
                ctx.scale(anim.scale, anim.scale);
                ctx.translate(-f.cx, -f.cy);

                if (showFill) {
                    const alpha = 0.15 + clamp(f.strength * 0.6, 0.05, 0.35);
                    const grad3 = ctx.createRadialGradient(f.cx, f.cy, 0, f.cx, f.cy, currentRadius);
                    grad3.addColorStop(0, `rgba(123, 156, 255, ${alpha})`);
                    grad3.addColorStop(0.6, `rgba(123, 156, 255, ${alpha * 0.5})`);
                    grad3.addColorStop(1, `rgba(123, 156, 255, 0)`);
                    ctx.fillStyle = grad3;
                    ctx.beginPath();
                    ctx.arc(f.cx, f.cy, currentRadius, 0, Math.PI * 2);
                    ctx.fill();
                }

                let borderAlpha = 0.4,
                    borderWidth = isSelected ? 3 : 2,
                    dashPattern = isSelected ? [] : [6, 8];
                if (isRunning) {
                    if (isAffecting) {
                        borderAlpha = 0.7;
                        borderWidth = isSelected ? 3 : 2.5;
                        dashPattern = isSelected ? [] : [4, 6];
                    } else {
                        borderAlpha = 0.15;
                        borderWidth = 1.5;
                        dashPattern = [4, 8];
                    }
                } else if (isFinished) {
                    borderAlpha = 0.3;
                    dashPattern = [6, 8];
                }

                ctx.strokeStyle = `hsla(${hue}, 80%, 60%, ${borderAlpha})`;
                ctx.lineWidth = borderWidth;
                ctx.setLineDash(dashPattern);
                ctx.beginPath();
                ctx.arc(f.cx, f.cy, currentRadius, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);

                let dotBrightness = 0.5;
                if (isRunning && isAffecting) dotBrightness = 0.8 + 0.2 * Math.sin(animTime * 2 + f.id);
                else if (isRunning && !isAffecting) dotBrightness = 0.15;
                else dotBrightness = 0.5 + 0.2 * Math.sin(animTime * 1.5 + f.id * 0.7);
                ctx.fillStyle = `hsla(${hue}, 90%, 70%, ${dotBrightness * 0.7})`;
                ctx.shadowColor = `hsla(${hue}, 90%, 70%, ${dotBrightness * 0.3})`;
                ctx.shadowBlur = 12 * dotBrightness;
                ctx.beginPath();
                ctx.arc(f.cx, f.cy, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.shadowBlur = 0;

                ctx.fillStyle = 'rgba(255,255,255,0.15)';
                ctx.font = '10px "Segoe UI", monospace';
                ctx.textAlign = 'center';
                ctx.fillText(`r=${Math.round(f.radius)}`, f.cx, f.cy + currentRadius + 16);
                ctx.fillStyle = 'rgba(255,255,255,0.1)';
                ctx.font = '9px "Segoe UI", monospace';
                ctx.fillText(`s=${f.strength.toFixed(2)}`, f.cx, f.cy - currentRadius - 8);

                if (f.builtIn) {
                    ctx.font = '900 14px "Font Awesome 6 Free"';
                    ctx.fillStyle = 'rgba(255, 215, 0, 0.85)';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    const lockX = f.cx + f.radius * 0.55,
                        lockY = f.cy - f.radius * 0.55;
                    ctx.fillText('\uf023', lockX, lockY);
                }

                if (isSelected) {
                    ctx.strokeStyle = `hsla(${hue}, 80%, 70%, 0.4)`;
                    ctx.lineWidth = 1;
                    ctx.setLineDash([3, 5]);
                    ctx.beginPath();
                    ctx.arc(f.cx, f.cy, currentRadius + 5, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);
                    ctx.fillStyle = `hsla(${hue}, 90%, 70%, 0.9)`;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = `hsla(${hue}, 90%, 70%, 0.3)`;
                    ctx.beginPath();
                    ctx.arc(f.cx, f.cy, 5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    const angle = Math.PI / 4;
                    const hx = f.cx + f.radius * Math.cos(angle),
                        hy = f.cy + f.radius * Math.sin(angle);
                    ctx.fillStyle = `hsla(${hue}, 90%, 70%, 0.8)`;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = `hsla(${hue}, 90%, 70%, 0.3)`;
                    ctx.beginPath();
                    ctx.arc(hx, hy, 6, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.fillStyle = 'rgba(255,255,255,0.15)';
                    ctx.font = '10px "Segoe UI", Arial, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText('移动', f.cx, f.cy - currentRadius - 12);
                    ctx.fillText('缩放', hx, hy - 12);
                }

                if (isRunning && isAffecting) {
                    for (let i = 0; i < f.numRings; i++) {
                        const p = f.ringProgress[i];
                        if (p > 0.005 && p < 0.995) {
                            const ringR = currentRadius * (1 - p);
                            if (ringR > 1.0) {
                                const alpha = Math.sin(p * Math.PI) * 0.7 + 0.1;
                                const width = 0.5 + (1 - p) * 2.5;
                                ctx.strokeStyle = `rgba(255, 220, 120, ${alpha})`;
                                ctx.lineWidth = width;
                                ctx.shadowColor = `rgba(255, 220, 120, ${alpha * 0.3})`;
                                ctx.shadowBlur = 6;
                                ctx.beginPath();
                                ctx.arc(f.cx, f.cy, ringR, 0, Math.PI * 2);
                                ctx.stroke();
                            }
                        }
                    }
                    ctx.shadowBlur = 0;
                }
                ctx.restore();
            }

            if (previousTrail.length > 1) {
                ctx.setLineDash([6, 8]);
                ctx.strokeStyle = 'rgba(200, 200, 255, 0.3)';
                ctx.lineWidth = 2;
                ctx.shadowBlur = 0;
                drawSampledTrail(previousTrail, 3);
                ctx.setLineDash([]);
            }

            if (car.trail.length > 1) {
                const trailLen = car.trail.length;
                const segments = Math.min(20, Math.floor(trailLen / 8) + 1);
                const segmentSize = Math.floor(trailLen / segments);
                if (segmentSize > 0) {
                    for (let seg = 0; seg < segments; seg++) {
                        const startIdx = seg * segmentSize;
                        const endIdx = Math.min(startIdx + segmentSize, trailLen);
                        if (endIdx - startIdx < 2) continue;
                        const t = seg / segments;
                        const alpha = t * 0.5 + 0.1;
                        const width = t * 2 + 1;
                        ctx.strokeStyle = `rgba(255, 200, 100, ${alpha * 0.6})`;
                        ctx.lineWidth = width;
                        ctx.shadowColor = `rgba(255, 200, 100, ${alpha * 0.2})`;
                        ctx.shadowBlur = 6;
                        const subTrail = car.trail.slice(startIdx, endIdx);
                        drawSampledTrail(subTrail, 1);
                    }
                    ctx.shadowBlur = 0;
                }
            }

            const angle = car.angle,
                cx = car.x,
                cy = car.y;
            const glowSize = CAR_RADIUS * 4.0;
            const grad5 = ctx.createRadialGradient(cx, cy, 0, cx, cy, glowSize);
            const glowAlpha = 0.08 + 0.04 * Math.sin(animTime * 3);
            grad5.addColorStop(0, `rgba(255, 200, 100, ${glowAlpha})`);
            grad5.addColorStop(0.5, `rgba(255, 200, 100, ${glowAlpha * 0.5})`);
            grad5.addColorStop(1, 'rgba(255, 200, 100, 0)');
            ctx.fillStyle = grad5;
            ctx.beginPath();
            ctx.arc(cx, cy, glowSize, 0, Math.PI * 2);
            ctx.fill();

            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(angle);
            ctx.shadowColor = 'rgba(255, 200, 80, 0.3)';
            ctx.shadowBlur = 20;
            const bodyColor = gameState === STATE.SUCCESS ? '#60a5fa' :
                gameState === STATE.FAIL ? '#f87171' :
                    '#fbbf24';
            ctx.fillStyle = bodyColor;
            ctx.strokeStyle = 'rgba(255,255,255,0.3)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(CAR_RADIUS * 1.6, 0);
            ctx.lineTo(-CAR_RADIUS * 1.0, -CAR_RADIUS * 0.9);
            ctx.lineTo(-CAR_RADIUS * 0.7, 0);
            ctx.lineTo(-CAR_RADIUS * 1.0, CAR_RADIUS * 0.9);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();
            ctx.shadowBlur = 0;
            ctx.fillStyle = 'rgba(255,255,200,0.6)';
            ctx.beginPath();
            ctx.arc(CAR_RADIUS * 1.0, -CAR_RADIUS * 0.45, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(CAR_RADIUS * 1.0, CAR_RADIUS * 0.45, 2.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(100, 200, 255, 0.2)';
            ctx.beginPath();
            ctx.arc(CAR_RADIUS * 0.3, 0, CAR_RADIUS * 0.4, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            if (car.speed > 0.1) {
                const len = Math.min(car.speed * 4, 60);
                ctx.strokeStyle = `rgba(255, 200, 100, ${0.15 + car.speed / MAX_SPEED * 0.25})`;
                ctx.lineWidth = 2;
                ctx.shadowColor = 'rgba(255, 200, 100, 0.2)';
                ctx.shadowBlur = 10;
                ctx.setLineDash([3, 4]);
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(cx + Math.cos(angle) * len, cy + Math.sin(angle) * len);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.shadowBlur = 0;
                const arrowSize = 6;
                ctx.fillStyle = `rgba(255, 200, 100, ${0.1 + car.speed / MAX_SPEED * 0.15})`;
                ctx.beginPath();
                ctx.moveTo(cx + Math.cos(angle) * len, cy + Math.sin(angle) * len);
                ctx.lineTo(cx + Math.cos(angle) * (len - arrowSize) + Math.cos(angle + 0.6) * arrowSize * 0.7,
                    cy + Math.sin(angle) * (len - arrowSize) + Math.sin(angle + 0.6) * arrowSize * 0.7);
                ctx.lineTo(cx + Math.cos(angle) * (len - arrowSize) + Math.cos(angle - 0.6) * arrowSize * 0.7,
                    cy + Math.sin(angle) * (len - arrowSize) + Math.sin(angle - 0.6) * arrowSize * 0.7);
                ctx.closePath();
                ctx.fill();
            }

            ctx.fillStyle = 'rgba(255,255,255,0.3)';
            ctx.font = '11px "Segoe UI", monospace';
            ctx.textAlign = 'center';
            ctx.fillText(`${car.speed.toFixed(2)}`, cx, cy + CAR_RADIUS + 22);

            if (gameState === STATE.LAYOUT && fields.length === 0 && boostZones.length === 0 && brakeZones.length === 0) {
                ctx.fillStyle = 'rgba(255,255,255,0.08)';
                ctx.font = '16px "Segoe UI", Arial, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('← 从侧边栏拖拽工具到画布上创建 →', W / 2, H - 40);
            }

            if (gameState === STATE.SUCCESS) {
                ctx.fillStyle = 'rgba(0,0,0,0.65)';
                ctx.fillRect(0, 0, W, H);
                ctx.font = '900 44px "Font Awesome 6 Free"';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#60a5fa';
                ctx.shadowColor = 'rgba(96, 165, 250, 0.3)';
                ctx.shadowBlur = 30;
                ctx.fillText('\uf091', W / 2 - 140, H / 2 - 60);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#60a5fa';
                ctx.font = 'bold 48px "Segoe UI", Arial, sans-serif';
                ctx.textBaseline = 'middle';
                ctx.fillText('通关成功！', W / 2 + 20, H / 2 - 60);
                const timeStr = elapsedTime > 0 ? elapsedTime.toFixed(1) : '0.0';
                const statsY = H / 2 + 12;
                ctx.fillStyle = 'rgba(255,255,255,0.55)';
                ctx.font = '19px "Segoe UI", Arial, sans-serif';
                ctx.textBaseline = 'top';
                ctx.fillText(`⏱ 用时: ${timeStr} 秒`, W / 2, statsY);
                const statsY2 = statsY + 34;
                ctx.fillStyle = 'rgba(255,255,255,0.45)';
                ctx.font = '17px "Segoe UI", Arial, sans-serif';
                const customFieldCount = fields.filter(f => !f.builtIn).length;
                const customBoostCount = boostZones.filter(z => !z.builtIn).length;
                const customBrakeCount = brakeZones.filter(z => !z.builtIn).length;
                const statItems = [
                    `🌀 引力场: ${customFieldCount}`,
                    `⚡ 加速区域: ${customBoostCount}`,
                    `🛑 刹车区域: ${customBrakeCount}`
                ];
                ctx.fillText(statItems.join('  ·  '), W / 2, statsY2);
                ctx.fillStyle = 'rgba(255,255,255,0.25)';
                ctx.font = '16px "Segoe UI", Arial, sans-serif';
                ctx.textBaseline = 'top';
                ctx.fillText('点击 "重置" 重新挑战', W / 2, statsY2 + 42);
            } else if (gameState === STATE.FAIL) {
                ctx.fillStyle = 'rgba(0,0,0,0.65)';
                ctx.fillRect(0, 0, W, H);
                ctx.font = '900 44px "Font Awesome 6 Free"';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = '#f87171';
                ctx.shadowColor = 'rgba(248, 113, 113, 0.3)';
                ctx.shadowBlur = 30;
                ctx.fillText('\uf057', W / 2 - 110, H / 2 - 10);
                ctx.shadowBlur = 0;
                ctx.fillStyle = '#f87171';
                ctx.font = 'bold 52px "Segoe UI", Arial, sans-serif';
                ctx.textBaseline = 'middle';
                ctx.fillText('失败', W / 2 + 30, H / 2 - 10);
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.font = '18px "Segoe UI", Arial, sans-serif';
                ctx.textBaseline = 'top';
                ctx.fillText('点击 "重置" 改进布局', W / 2, H / 2 + 52);
            }

            ctx.restore();
            updateUI();
        }

        // ---------- 物理更新 ----------
        function updatePhysics() {
            if (gameState !== STATE.RUNNING) return;
            updateEnemies();
            updateCheckpoints();
            let ax = 0,
                ay = 0;

            for (const f of fields) {
                const dx = f.cx - car.x,
                    dy = f.cy - car.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < f.radius && dist > 0.1) {
                    const strengthFactor = 1 - (dist / f.radius);
                    const forceMag = f.strength * strengthFactor * 1.8;
                    const normX = dx / dist,
                        normY = dy / dist;
                    ax += forceMag * normX;
                    ay += forceMag * normY;
                } else if (dist < 0.1 && dist < f.radius) {
                    const angle = Math.random() * Math.PI * 2;
                    const forceMag = f.strength * 0.5;
                    ax += forceMag * Math.cos(angle);
                    ay += forceMag * Math.sin(angle);
                }
            }

            for (const z of boostZones) {
                const dist = distance(car.x, car.y, z.cx, z.cy);
                if (dist < z.radius) {
                    const spd = car.speed;
                    if (spd > 0.01) {
                        const strengthFactor = 1 - (dist / z.radius);
                        const forceMag = z.strength * strengthFactor * 2.0;
                        const dirX = car.vx / spd,
                            dirY = car.vy / spd;
                        ax += forceMag * dirX;
                        ay += forceMag * dirY;
                    } else {
                        const angle = Math.random() * Math.PI * 2;
                        const forceMag = z.strength * 0.3;
                        ax += forceMag * Math.cos(angle);
                        ay += forceMag * Math.sin(angle);
                    }
                }
            }

            for (const z of brakeZones) {
                const dist = distance(car.x, car.y, z.cx, z.cy);
                if (dist < z.radius) {
                    const spd = car.speed;
                    if (spd > 0.01) {
                        const strengthFactor = 1 - (dist / z.radius);
                        const forceMag = z.strength * strengthFactor * 2.0;
                        const dirX = -car.vx / spd,
                            dirY = -car.vy / spd;
                        ax += forceMag * dirX;
                        ay += forceMag * dirY;
                    }
                }
            }

            const spd = car.speed;
            if (spd > 0.01) {
                const dirX = car.vx / spd,
                    dirY = car.vy / spd;
                ax += FIXED_THRUST * dirX;
                ay += FIXED_THRUST * dirY;
            } else {
                ax += FIXED_THRUST * 1.0;
                ay += 0;
            }

            car.vx += ax * DT;
            car.vy += ay * DT;
            car.vx *= FRICTION_AIR;
            car.vy *= FRICTION_AIR;
            const speed = car.speed;
            if (speed > MAX_SPEED) {
                car.vx = (car.vx / speed) * MAX_SPEED;
                car.vy = (car.vy / speed) * MAX_SPEED;
            }
            car.x += car.vx * DT * 60;
            car.y += car.vy * DT * 60;

            const margin = 30;
            if (car.x < -margin || car.x > W + margin || car.y < -margin || car.y > H + margin) {
                setState(STATE.FAIL);
                return;
            }
            if (!isOnRoad(car.x, car.y)) { setState(STATE.FAIL); return; }
            car.trail.push({ x: car.x, y: car.y });
            if (car.trail.length > car.maxTrail) car.trail.shift();

            const allCheckpointsPassed = checkpoints.every(cp => cp.passed);
            if (distance(car.x, car.y, endPos.x, endPos.y) < TARGET_RADIUS + CAR_RADIUS * 0.6) {
                if (checkpoints.length > 0 && !allCheckpointsPassed) {
                    showToast(
                        `<i class="fas fa-exclamation-triangle"></i> 请通过所有检查点！`, 2000);
                } else { setState(STATE.SUCCESS); }
                return;
            }
            updateUI();
        }

        function updateEnemies() {
            if (gameState !== STATE.RUNNING || enemies.length === 0) return;
            for (const en of enemies) {
                const dx = car.x - en.currentX,
                    dy = car.y - en.currentY;
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist > 0.5) {
                    const normX = dx / dist,
                        normY = dy / dist;
                    en.currentX += normX * en.speed;
                    en.currentY += normY * en.speed;
                }
                en.currentX = clamp(en.currentX, -30, W + 30);
                en.currentY = clamp(en.currentY, -30, H + 30);
                if (!en.trail) en.trail = [];
                en.trail.push({ x: en.currentX, y: en.currentY });
                if (en.trail.length > 12) en.trail.shift();
                if (distance(car.x, car.y, en.currentX, en.currentY) < en.radius + CAR_RADIUS) {
                    setState(STATE.FAIL);
                    showToast(`<i class="fas fa-skull"></i> 被敌人追上！`, 1500); return;
                }
            }
        }

        function updateCheckpoints() {
            if (gameState !== STATE.RUNNING || checkpoints.length === 0) return;
            let nextIdx = -1;
            for (let i = 0; i < checkpoints.length; i++) { if (!checkpoints[i].passed) { nextIdx = i; break; } }
            if (nextIdx === -1) return;
            const cp = checkpoints[nextIdx];
            if (distance(car.x, car.y, cp.x, cp.y) < cp.radius + CAR_RADIUS * 0.5) {
                cp.passed = true;
                updateCheckpointUI();
                showToast(`<i class="fas fa-check-circle"></i> 检查点 ${nextIdx + 1}/${checkpoints.length} 通过！`, 800);
            }
        }

        // ============================================================
        //  鼠标事件 (保留)
        // ============================================================
        function onCanvasMouseMove(e) {
            const pos = getMousePos(e);
            const mx = pos.x,
                my = pos.y;
            if (isDragging && gameState === STATE.LAYOUT) {
                dragCurrentX = mx;
                dragCurrentY = my;
                isDraggingValid = distance(dragStartX, dragStartY, dragCurrentX, dragCurrentY) > 5;
            }
            updateCursorStyle(mx, my);
        }

        function onCanvasMouseLeave() { canvas.style.cursor = 'default'; }

        function onMouseDown(e) {
            if (gameState !== STATE.LAYOUT || e.button !== 0) return;
            const pos = getMousePos(e);
            const mx = pos.x,
                my = pos.y;
            const field = getFieldAt(mx, my);
            if (field) {
                selectedField = field;
                selectedBoost = null;
                selectedBrake = null;
                const dist = distance(mx, my, field.cx, field.cy);
                const ratio = field.radius > 0 ? dist / field.radius : 0;
                if (ratio < MOVE_THRESHOLD) {
                    dragMode = 'move';
                    dragTarget = { type: 'field', ref: field };
                    dragOffsetX = mx - field.cx;
                    dragOffsetY = my - field.cy;
                    canvas.style.cursor = 'move';
                } else {
                    dragMode = 'resize';
                    dragTarget = { type: 'field', ref: field };
                    dragStartRadius = field.radius;
                    dragStartMouseDist = dist;
                    const angle = Math.atan2(my - field.cy, mx - field.cx);
                    canvas.style.cursor = getResizeCursor(angle);
                }
                isMouseDownOnTarget = true;
                mouseDownTarget = { type: 'field', ref: field };
                document.addEventListener('mousemove', onDocumentMouseMove);
                document.addEventListener('mouseup', onDocumentMouseUp);
                return;
            }
            const boost = getBoostAt(mx, my);
            if (boost) {
                selectedBoost = boost;
                selectedField = null;
                selectedBrake = null;
                const dist = distance(mx, my, boost.cx, boost.cy);
                const ratio = boost.radius > 0 ? dist / boost.radius : 0;
                if (ratio < MOVE_THRESHOLD) {
                    dragMode = 'move';
                    dragTarget = { type: 'boost', ref: boost };
                    dragOffsetX = mx - boost.cx;
                    dragOffsetY = my - boost.cy;
                    canvas.style.cursor = 'move';
                } else {
                    dragMode = 'resize';
                    dragTarget = { type: 'boost', ref: boost };
                    dragStartRadius = boost.radius;
                    dragStartMouseDist = dist;
                    const angle = Math.atan2(my - boost.cy, mx - boost.cx);
                    canvas.style.cursor = getResizeCursor(angle);
                }
                isMouseDownOnTarget = true;
                mouseDownTarget = { type: 'boost', ref: boost };
                document.addEventListener('mousemove', onDocumentMouseMove);
                document.addEventListener('mouseup', onDocumentMouseUp);
                return;
            }
            const brake = getBrakeAt(mx, my);
            if (brake) {
                selectedBrake = brake;
                selectedField = null;
                selectedBoost = null;
                const dist = distance(mx, my, brake.cx, brake.cy);
                const ratio = brake.radius > 0 ? dist / brake.radius : 0;
                if (ratio < MOVE_THRESHOLD) {
                    dragMode = 'move';
                    dragTarget = { type: 'brake', ref: brake };
                    dragOffsetX = mx - brake.cx;
                    dragOffsetY = my - brake.cy;
                    canvas.style.cursor = 'move';
                } else {
                    dragMode = 'resize';
                    dragTarget = { type: 'brake', ref: brake };
                    dragStartRadius = brake.radius;
                    dragStartMouseDist = dist;
                    const angle = Math.atan2(my - brake.cy, mx - brake.cx);
                    canvas.style.cursor = getResizeCursor(angle);
                }
                isMouseDownOnTarget = true;
                mouseDownTarget = { type: 'brake', ref: brake };
                document.addEventListener('mousemove', onDocumentMouseMove);
                document.addEventListener('mouseup', onDocumentMouseUp);
                return;
            }
            clearSelection();
        }

        function onDocumentMouseMove(e) {
            if (gameState !== STATE.LAYOUT || !isMouseDownOnTarget) return;
            const canvasPos = getMousePos(e);
            const mx = canvasPos.x,
                my = canvasPos.y;
            const inTrash = isPointInTrash(e.clientX, e.clientY);
            isOverTrash = inTrash;
            trashZone.classList.toggle('drag-over', inTrash);
            if (dragMode === 'move' && dragTarget && !inTrash) {
                const target = dragTarget;
                const newX = clamp(mx - dragOffsetX, 0, W);
                const newY = clamp(my - dragOffsetY, 0, H);
                if (target.type === 'field') {
                    target.ref.cx = newX;
                    target.ref.cy = newY;
                } else if (target.type === 'boost') {
                    target.ref.cx = newX;
                    target.ref.cy = newY;
                } else if (target.type === 'brake') {
                    target.ref.cx = newX;
                    target.ref.cy = newY;
                }
                canvas.style.cursor = 'move';
            } else if (dragMode === 'resize' && dragTarget && !inTrash) {
                const target = dragTarget;
                const dist = distance(mx, my, target.ref.cx, target.ref.cy);
                let newRadius = Math.max(dist, MIN_RADIUS);
                newRadius = Math.min(newRadius, MAX_RADIUS);
                target.ref.radius = newRadius;
                if (target.type === 'field') updateFieldStrength(target.ref);
                else if (target.type === 'boost') updateBoostStrength(target.ref);
                else if (target.type === 'brake') updateBrakeStrength(target.ref);
                const angle = Math.atan2(my - target.ref.cy, mx - target.ref.cx);
                canvas.style.cursor = getResizeCursor(angle);
            }
        }

        function onDocumentMouseUp(e) {
            if (gameState !== STATE.LAYOUT) { cleanupDrag(); return; }
            if (!isMouseDownOnTarget) { cleanupDrag(); return; }
            const inTrash = isPointInTrash(e.clientX, e.clientY);
            if (inTrash && mouseDownTarget) {
                const target = mouseDownTarget;
                if (target.type === 'field') {
                    removeField(target.ref);
                    showToast(`<i class="fas fa-trash"></i> 已删除引力场`, 1000);
                } else if (target.type === 'boost') {
                    removeBoostZone(
                        target.ref);
                    showToast(`<i class="fas fa-trash"></i> 已删除加速区域`, 1000);
                } else if (target.type === 'brake') {
                    removeBrakeZone(
                        target.ref);
                    showToast(`<i class="fas fa-trash"></i> 已删除刹车区域`, 1000);
                }
                updateUI();
            }
            cleanupDrag();
            trashZone.classList.remove('drag-over');
            const pos = getMousePos(e);
            updateCursorStyle(pos.x, pos.y);
        }

        function cleanupDrag() {
            isMouseDownOnTarget = false;
            mouseDownTarget = null;
            dragMode = null;
            dragTarget = null;
            isOverTrash = false;
            document.removeEventListener('mousemove', onDocumentMouseMove);
            document.removeEventListener('mouseup', onDocumentMouseUp);
        }

        function onRightClick(e) {
            e.preventDefault();
            if (gameState !== STATE.LAYOUT) { showToast(`<i class="fas fa-ban"></i> 模拟中无法修改区域`, 1200); return; }
            const pos = getMousePos(e);
            const mx = pos.x,
                my = pos.y;
            const field = getFieldAt(mx, my);
            if (field) {
                removeField(field);
                updateUI();
                showToast(`<i class="fas fa-trash"></i> 已移除引力场`, 1000); return;
            }
            const boost = getBoostAt(mx, my);
            if (boost) {
                removeBoostZone(boost);
                updateUI();
                showToast(`<i class="fas fa-trash"></i> 已移除加速区域`, 1000); return;
            }
            const brake = getBrakeAt(mx, my);
            if (brake) {
                removeBrakeZone(brake);
                updateUI();
                showToast(`<i class="fas fa-trash"></i> 已移除刹车区域`, 1000); return;
            }
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = 'copy';
        }

        function handleDrop(e) {
            e.preventDefault();
            if (gameState !== STATE.LAYOUT) { showToast(`<i class="fas fa-ban"></i> 只能在布局阶段创建`, 1200); return; }
            const pos = getMousePos(e);
            const mx = pos.x,
                my = pos.y;
            if (mx < 0 || mx > W || my < 0 || my > H) {
                showToast(`<i class="fas fa-exclamation-triangle"></i> 请拖拽到画布内部`,
                    1000); return;
            }
            const type = e.dataTransfer.getData('text/plain') || 'field';
            const radius = Math.min(DEFAULT_RADIUS, MAX_RADIUS);
            let obj;
            if (type === 'field') {
                obj = createField(mx, my, radius);
                fields.push(obj);
                showToast(`<i class="fas fa-check-circle"></i> 创建引力场 (r=${Math.round(radius)})`, 800);
            } else if (type ===
                'boost') {
                obj = createBoostZone(mx, my, radius);
                boostZones.push(obj);
                showToast(`<i class="fas fa-check-circle"></i> 创建加速区域 (r=${Math.round(radius)})`, 800);

                e.preventDefault();

                if (selectedField) {
                    removeField(selectedField);
                    updateUI();
                    showToast(`<i class="fas fa-trash"></i> 已移除选中引力场`, 600);
                    e.preventDefault();

                dragImageElement = null;
                document.removeEventListener('dragend', cleanup);

        let workshopCollections = [];

        function parseCollectionFile(data) {
            if (!Array.isArray(data) || data.length === 0) throw new Error('无效的关卡集文件：数据为空');
            const meta = data[0];
            if (!meta.levelsName || !meta.levelsDescription) throw new Error(
                '关卡集元数据不完整：缺少 levelsName 或 levelsDescription');
            const levels = data.slice(1);
            if (levels.length === 0) throw new Error('关卡集没有包含任何关卡');
            for (const lv of levels) {
                if (!lv.name || !lv.start || !lv.end || !lv.path || !Array.isArray(lv.path)) throw new Error(
                    `关卡 "${lv.name || '未命名'}" 数据不完整`);
            }
            return { meta, levels };
        }

        function importCollection(file) {
            const reader = new FileReader();
            reader.onload = function (e) {
                try {
                    const data = JSON.parse(e.target.result);
                    const { meta, levels } = parseCollectionFile(data);
                    const existing = workshopCollections.find(c => c.meta.levelsName === meta.levelsName);
                    if (existing) {
                        showToast(`<i class="fas fa-exclamation-triangle"></i> 已存在同名关卡集 "${meta.levelsName}"`,
                            2000); return;
                    }
                    const id = 'col_' + (++collectionIdCounter);
                    const collection = { id, meta: { ...meta }, levels: levels, isActive: false };
                    workshopCollections.push(collection);
                    saveWorkshopData();
                    renderWorkshopCards();
                    showToast(`<i class="fas fa-check-circle"></i> 已导入 "${meta.levelsName}" (${levels.length} 关)`,
                        1800);
                    updateWorkshopInfo();
                } catch (err) { showToast(`<i class="fas fa-exclamation-triangle"></i> 导入失败: ${err.message}`, 2500); }
            };
            reader.onerror = function () { showToast(`<i class="fas fa-exclamation-triangle"></i> 文件读取失败`, 2000); };
            reader.readAsText(file);
        }

        function loadCollection(collection) {
            settingsOverlay.classList.remove('visible');
            workshopOverlay.classList.remove('visible');
            for (const c of workshopCollections) c.isActive = false;
            collection.isActive = true;
            saveWorkshopData();
            isWorkshopMode = true;
            mainLevelsBackup = LEVELS;
            LEVELS = collection.levels;
            unlockedLevelIndex = LEVELS.length - 1;
            currentLevelIndex = 0;
            hideMenu();
            loadLevel(0);
            workshopBadge.classList.add('visible');
            renderWorkshopCards();
            updateWorkshopInfo();
            updateSettingsInfo();
            showToast(`<i class="fas fa-cubes"></i> 已加载 "${collection.meta.levelsName}" (${collection.levels.length} 关)`,
                1500);
        }

        function deleteCollection(id) {
            const idx = workshopCollections.findIndex(c => c.id === id);
            if (idx === -1) return;
            const col = workshopCollections[idx];
            if (col.isActive) {
                const remaining = workshopCollections.filter((_, i) => i !== idx);
                if (remaining.length > 0) loadCollection(remaining[0]);
                else {
                    isWorkshopMode = false;
                    if (mainLevelsBackup) {
                        LEVELS = mainLevelsBackup;
                        mainLevelsBackup = null;
                    } else LEVELS = DEFAULT_LEVELS;
                    unlockedLevelIndex = 0;
                    loadUnlockedFromStorage();
                    currentLevelIndex = 0;
                    loadLevel(0);
                    workshopBadge.classList.remove('visible');
                    col.isActive = false;
                    saveWorkshopData();
                    showToast(`<i class="fas fa-info-circle"></i> 已退出工坊模式`, 1200);
                }
            } else {
                workshopCollections.splice(idx, 1);
                saveWorkshopData();
                renderWorkshopCards();
                updateWorkshopInfo();
                updateSettingsInfo();
                showToast(`<i class="fas fa-trash"></i> 已删除 "${col.meta.levelsName}"`, 1200);
                return;
            }
            renderWorkshopCards();
            updateWorkshopInfo();
            updateSettingsInfo();
