<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PulFlex - 多人协作新主张</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>
    <div class="workbench-layout">
        <!-- 左侧导航栏（含底部用户信息及退出按钮） -->
        <nav class="sidebar">
            <div class="sidebar-header">
                <b>
                    <h2>PulFlex 2026 α</h2>
                </b>
            </div>
            <ul class="nav-menu">
                <li class="nav-item active" data-module="home">🏠 首页</li>
                <li class="nav-item" data-module="todo">✅ 待办</li>
                <li class="nav-item" data-module="document">📄 文档</li>
                <li class="nav-item" data-module="mail">📧 邮件</li>
                <li class="nav-item" data-module="file">📁 网盘</li>
                <li class="nav-item" data-module="personalize">🎨 个性化（内测）</li>
            </ul>
            <!-- 底部用户信息及退出按钮（新增） -->
            <div class="sidebar-footer">
                <div class="user-info-sidebar">
                    <span id="sidebar-username"></span>
                </div>
                <div id="sidebar-admin-panel" style="display: none;">
                    <button onclick="goToAdmin()" class="btn btn-secondary sidebar-btn">管理面板</button>
                </div>
                <button onclick="logout()" class="btn btn-danger sidebar-btn">退出登录</button>
            </div>
        </nav>

        <!-- 右侧主内容区（无顶部用户栏） -->
        <main class="main-area">
            <!-- 模块容器 -->
            <div class="module-container">
                <!-- 首页模块 -->
                <div id="module-home" class="module-page active">
                    <div class="home-clock" id="home-clock">--:--:--</div>
                    <div class="notification-board"
                        style="background: #1A1A1A; border-radius: 20px; padding: 25px; border: 1px solid #333333; margin-top: 20px; width: 33.33%; min-width: 320px; margin-left: auto; margin-right: auto;">
                        <div
                            style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                            <div style="display: flex; align-items: center; gap: 10px;">
                                <span style="font-size: 24px;">🔔</span>
                                <h3 style="margin: 0; color: #FFFFFF; font-size: 20px;">消息通知</h3>
                            </div>
                            <button class="btn btn-danger" onclick="clearAllNotifications()"
                                style="padding: 6px 16px; font-size: 13px;">全部清除</button>
                        </div>
                        <div id="notification-list" style="max-height: 400px; overflow-y: auto;">
                            <div class="empty-msg">暂无通知</div>
                        </div>
                    </div>
                </div>

                <!-- 待办模块 -->
                <div id="module-todo" class="module-page">
                    <div class="module-header">
                        <h2>待办任务</h2>
                        <button id="new-task-btn" class="btn-icon">+</button>
                    </div>
                    <div id="task-list" class="module-content"></div>
                </div>

                <!-- 文档模块 -->
                <div id="module-document" class="module-page">
                    <div class="module-header">
                        <h2>我的文档</h2>
                        <button id="new-document-btn" class="btn-icon">+</button>
                    </div>
                    <div id="document-list" class="module-content">
                        <!-- 文档列表将动态生成 -->
                    </div>
                </div>

                <!-- 邮件模块 -->
                <div id="module-mail" class="module-page">
                    <div class="module-header">
                        <h2>邮件</h2>
                        <div style="display: flex; align-items: center; gap: 10px;">
                            <button onclick="window.location.href='/chat'" class="btn btn-secondary"
                                style="padding: 6px 16px; font-size: 13px; border-radius: 9999px;">💬 会话</button>
                            <button id="new-mail-btn" class="btn-icon">+</button>
                        </div>
                    </div>
                    <div id="mail-list" class="module-content"></div>
                </div>

                <!-- 个性化模块 -->
                <div id="module-personalize" class="module-page">
                    <div class="module-header">
                        <h2>个性化（内测）设置</h2>
                    </div>
                    <div class="module-content">
                        <div class="personalize-section">
                            <div class="personalize-card">
                                <div class="personalize-item">
                                    <div class="personalize-info">
                                        <span id="theme-label" class="personalize-title">🌙 黑夜模式</span>
                                        <span class="personalize-desc">切换页面的整体配色风格</span>
                                    </div>
                                    <label class="theme-switch">
                                        <input type="checkbox" id="theme-toggle" onchange="toggleTheme()">
                                        <span class="theme-slider"></span>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 网盘模块 -->
                <div id="module-file" class="module-page">
                    <div class="module-header">
                        <h2>网盘</h2>
                        <button id="upload-file-btn" class="btn-icon">📁</button>
                    </div>
                    <div id="file-list" class="module-content"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- ========== 原有模态框保持不变 ========== -->
    <!-- 发送邮件模态框 -->
    <div id="mail-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h4>写消息</h4>
                <span class="close" id="close-mail-modal">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>接收人：</label>
                    <select id="receiver-select" class="form-control"></select>
                </div>
                <div class="form-group">
                    <label>消息内容：</label>
                    <textarea id="mail-content" class="form-control" placeholder="输入消息内容" rows="5"></textarea>
                </div>
                <div class="modal-actions">
                    <button id="send-mail" class="btn btn-primary">发送</button>
                    <button id="cancel-mail" class="btn btn-secondary">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 任务创建模态框 -->
    <div id="task-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h4>新建任务</h4>
                <span class="close" id="close-task-modal">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>任务标题：</label>
                    <input type="text" id="task-title" class="form-control" placeholder="输入任务标题">
                </div>
                <div class="form-group">
                    <label>任务内容：</label>
                    <textarea id="task-content" class="form-control" placeholder="输入任务详情" rows="4"></textarea>
                </div>
                <div class="form-group">
                    <label>负责人：</label>
                    <select id="task-assignee" class="form-control"></select>
                </div>
                <div class="modal-actions">
                    <button id="create-task" class="btn btn-primary">创建</button>
                    <button id="cancel-task" class="btn btn-secondary">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 文件上传模态框 -->
    <div id="file-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h4>上传文件</h4>
                <span class="close" id="close-file-modal">&times;</span>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>选择文件：</label>
                    <input type="file" id="file-input" class="form-control">
                </div>
                <div class="modal-actions">
                    <button id="upload-file" class="btn btn-primary">上传</button>
                    <button id="cancel-file" class="btn btn-secondary">取消</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 消息详情模态框 -->
    <div id="message-detail-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h4>消息详情</h4>
                <span class="close" id="close-message-detail">&times;</span>
            </div>
            <div class="modal-body">
                <div id="message-content"></div>
            </div>
        </div>
    </div>




    <script src="{{ url_for('static', filename='scripts.js') }}"></script>
</body>

</html>
